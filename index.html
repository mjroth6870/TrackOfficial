          (R ? '<label class="ent-main"><span>Team</span><input class="f ent-team" list="entTeam" value="' + esc(l._school != null ? l._school : relaySchool(l)) + '" placeholder="Start typing a team" autocomplete="off"></label>'
             : '<label class="ent-main"><span>Athlete</span><input class="f ent-who" list="entAth" value="' + esc(entWho(l)) + '" placeholder="Start typing a name" autocomplete="off"></label>') +
          '<button class="btn sm warn ent-del" data-ent="delrow" aria-label="Remove">×</button>' +
          (R ? '<div class="ent-legs">' + [0, 1, 2, 3].map(function(k){ return '<label><span>Leg ' + (k + 1) + '</span><input class="f ent-leg" list="entAth" value="' + esc(l.legs[k] || '') + '" placeholder="Runner ' + (k + 1) + '" autocomplete="off"></label>'; }).join('') + '</div>' : '') +
        '</div>';

/* Read the form back into ENT.secs without judging it yet. */
function entRead(){
  $$('#entBody .ent-heat').forEach(function(sec){
    var s = ENT.secs[+sec.dataset.h];
    $$('.ent-row', sec).forEach(function(row){
      var l = s.lanes[+row.dataset.r]; l.lane = $('.ent-lane', row).value.trim();
      if (ENT.relay){ l._team = $('.ent-team', row).value.trim(); l.legs = $$('.ent-leg', row).map(function(x){ return x.value.trim(); }); }

    });
  });

function entClick(ev){
  var b = ev.target.closest('[data-ent]'); if (!b) return;
  var a = b.dataset.ent;
  if (a === 'close'){ $('#dlg').innerHTML = ''; ENT = null; return; }
  entRead();
  var sec = b.closest('.ent-heat'), s = sec ? ENT.secs[+sec.dataset.h] : null;
  if (a === 'addheat'){ ENT.secs.push({ kind:(ENT.secs[0] && ENT.secs[0].kind) || (isFieldEv(ENT.e) ? 'Flight' : 'Heat'), num:ENT.secs.length + 1, lanes:[{ lane:'1', name:'', team:'', bib:'', legs:ENT.relay ? ['', '', '', ''] : undefined }] }); entSync(); entDraw(); return; }
  if (a === 'delheat'){ ENT.secs.splice(+sec.dataset.h, 1); entSync(); entDraw(); return; }
  if (a === 'addrow'){ var used = s.lanes.map(function(l){ return +l.lane || 0; }); s.lanes.push({ lane:String((used.length ? Math.max.apply(null, used) : 0) + 1), name:'', team:'', bib:'', legs:ENT.relay ? ['', '', '', ''] : undefined }); entSync(); entDraw(); var rows = $$('.ent-heat[data-h="' + ENT.secs.indexOf(s) + '"] .ent-row'); var inp = rows.length && rows[rows.length - 1].querySelector('.ent-who,.ent-team'); if (inp) inp.focus(); return; }
  if (a === 'delrow'){ s.lanes.splice(+b.closest('.ent-row').dataset.r, 1); entSync(); entDraw(); return; }

/* Keep what was typed when the form is redrawn. */
function entSync(){ ENT.secs.forEach(function(s){ s.lanes.forEach(function(l){ if (ENT.relay){ if (l._team != null) l._school = l._team; } else if (l._who != null){ var p = l._who.split(' — '); l.name = p[0] || ''; l.team = p[1] || ''; l._typed = l._who; } delete l._team; delete l._who; }); }); }
function entSave(){
  var P = ENT.P, errs = [], e = ENT.e, R = ENT.relay, orig = {};
  (e.entries || []).forEach(function(s){ s.lanes.forEach(function(l){ var k = R ? 't:' + shoeNorm(relaySchool(l)) : 'a:' + shoeNorm(l.name) + '|' + shoeNorm(l.team); (orig[k] = orig[k] || []).push(l); }); });
  var take = function(k){ return (orig[k] && orig[k].shift()) || null; };
  var out = [];
  ENT.secs.forEach(function(s, h){
    var lanes = [], seen = {};
    s.lanes.forEach(function(l){
      var lane = String(l.lane || '').trim();
      if (R){
        var team = String(l._team != null ? l._team : relaySchool(l)).trim(), legs = (l.legs || []).map(function(x){ return String(x || '').trim(); });
        if (!team && !legs.some(Boolean)) return;
        if (!team){ errs.push(cap(unitOf(e, s)) + ' ' + (h + 1) + ', lane ' + (lane || '?') + ': pick the team.'); return; }
        if (P.teams.indexOf(team) < 0 && !(orig['t:' + shoeNorm(team)] || []).length) errs.push('“' + team + '” isn\'t a team in the meet program.');
        var clean = legs.map(function(n, k){ if (!n) return ''; var hit = entFind(P, n); if (!hit){ errs.push('Leg ' + (k + 1) + ' for ' + team + ': “' + n + '” isn\'t in the meet program.'); return n; } return hit.name; });
        var dupe = clean.filter(Boolean).filter(function(n, i, arr){ return arr.indexOf(n) !== i; });
        if (dupe.length) errs.push(team + ': ' + dupe[0] + ' is entered on two legs.');
        var o = take('t:' + shoeNorm(team)) || {};
        lanes.push(Object.assign({}, o, { lane:lane, name:o.name || team, team:o.team || team, bib:o.bib || '', legs:clean, members:o.members && o.members.length ? o.members : clean.filter(Boolean) }));
      } else {
        var who = String(l._who != null ? l._who : entWho(l)).trim(); if (!who) return;
        var hit = entFind(P, who);
        if (!hit){ errs.push('“' + who + '” isn\'t in the meet program. Pick a name from the list.'); return; }
        var o2 = take('a:' + shoeNorm(hit.name) + '|' + shoeNorm(hit.team)) || {};
        lanes.push(Object.assign({}, o2, { lane:lane, name:hit.name, team:hit.team || '', bib:o2.bib || Object.keys(hit.bibs || {})[0] || '' }));
      }
      if (!lane) errs.push(cap(unitOf(e, s)) + ' ' + (h + 1) + ': every ' + (R ? 'team' : 'athlete') + ' needs a lane.');
      else if (seen[lane]) errs.push(cap(unitOf(e, s)) + ' ' + (h + 1) + ': lane ' + lane + ' is used twice.');
      seen[lane] = 1;
    });
    if (lanes.length) out.push({ kind:s.kind || 'Heat', num:0, label:s.label || '', lanes:lanes.sort(function(a, b){ return (parseFloat(a.lane) || 0) - (parseFloat(b.lane) || 0); }) });
  });
  if (errs.length){ var er = $('#entErr'); er.hidden = false; er.innerHTML = errs.slice(0, 6).map(esc).join('<br>'); er.scrollIntoView({ block:'nearest' }); entSync(); return; }
  out.forEach(function(s, i){ s.num = i + 1; s.of = out.length; });
  e.entries = out; e.heats = out.length ? String(out.length) : e.heats; e.athletes = out.reduce(function(n, s){ return n + s.lanes.length; }, 0) || ''; e.entriesByClerk = true;
  $('#dlg').innerHTML = ''; ENT = null;
  save(); render(); toast(out.length ? 'Saved ' + evTitle(e) + ': ' + e.athletes + (R ? ' teams' : ' athletes') + ' in ' + units(e, out.length) : 'Cleared the athletes for ' + evTitle(e));
}
function entMainClick(ev){ var b = ev.target.closest('[data-entedit]'); if (!b) return false; openEntries(b.dataset.entedit); return true; }
/* A re-imported meet program keeps the clerks' work: an event the program still leaves empty keeps the
   athletes the clerks entered, and relay legs carry over to the same team. */
function mergeEntries(old, inc){
  old = old || []; inc = inc || [];
  if (!inc.length) return old;
  var key = function(l){ return shoeNorm(relaySchool(l)) + '|' + relayLetter(l); }, legs = {};
  old.forEach(function(s){ s.lanes.forEach(function(l){ if (laneLegs(l)) legs[key(l)] = l.legs; }); });
  inc.forEach(function(s){ s.lanes.forEach(function(l){ var g = legs[key(l)]; if (g && !l.legs) l.legs = g.slice(); }); });
  return inc;
}


/* =====================================================================
   Combined events — up to two coordinators run the multi-events (every
   discipline, track and field) instead of clerking: they check athletes in,
   move start times, note when each event starts and ends, and see a countdown
   to the next event.
   ===================================================================== */
var CE_RE = /pentathlon|heptathlon|decathlon|octathlon|triathlon|tetrathlon|icosathlon|combined\s*event|multi-?event|\bpent\b|\bhept\b|\bdec\b/i;
function isMultiEv(e){ return CE_RE.test((e.fullName || '') + ' ' + (e.name || '')); }
function ceCoords(){ var m = (M && M.multi) || {}; return (m.coords || []).slice(0, Math.max(0, Math.min(2, m.n || 0))); }
function multiOn(){ return !!(M && M.multi && M.multi.n > 0); }
function ceManaged(e){ return multiOn() && isMultiEv(e); }
/* Check-in status counts for an event when the clerks run it, or when a coordinator does. */
/* Field events check in with the officials at the event, not clerking; a combined events coordinator checks in every event they run. */

  /* Remove a meet's local copy from this device, after its last changes reach the shared copy. */

  /* ---------- setup check: what's missing in the open meet ---------- */

    if (!M.shared) warn('Not shared live', 'Only on one device, so officials can\'t open it with access codes.'); else ok('Shared live', 'Officials can open it with their access codes.');
    if (!M.days.length) warn('No competition days', 'Add a day in Setup → Meet.'); else ok(M.days.length + (M.days.length === 1 ? ' competition day' : ' competition days'), '');

      if (empty) info(empty + ' event' + (empty === 1 ? ' has' : 's have') + ' no athletes yet', 'Normal for finals and semis. Clerks or the meet director add athletes from the meet program.');
    }

    var m = Math.floor(v / 60), s = v - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
  }

  /* Events: [name, kind, per heat, seed base (W, M)]. kind: run | field | relay. */
  var INDOOR = [
    ['60 Meter Dash', 'run', 8, [7.60, 6.85]], ['60 Meter Hurdles', 'run', 8, [8.60, 8.05]], ['200 Meter Dash', 'run', 6, [24.6, 21.8]],
    ['400 Meter Dash', 'run', 6, [55.5, 48.8]], ['800 Meter Run', 'run', 8, [131, 113]], ['Mile Run', 'run', 12, [290, 248]],
    ['3000 Meter Run', 'run', 14, [580, 500]], ['4x400 Meter Relay', 'relay', 6, [228, 197]], ['Distance Medley Relay', 'relay', 6, [705, 600]],
    ['High Jump', 'field', 10, [1.75, 2.10]], ['Pole Vault', 'field', 10, [4.10, 5.20]], ['Long Jump', 'field', 10, [6.10, 7.40]],
    ['Triple Jump', 'field', 10, [12.80, 15.20]], ['Shot Put', 'field', 10, [15.20, 17.80]], ['Weight Throw', 'field', 10, [19.50, 20.10]]
  ];
  var OUTDOOR = [
    ['100 Meter Dash', 'run', 8, [11.80, 10.45]], ['HURDLES', 'run', 8, [13.80, 14.10]], ['200 Meter Dash', 'run', 8, [24.0, 21.2]],
    ['400 Meter Dash', 'run', 8, [54.5, 47.5]], ['400 Meter Hurdles', 'run', 8, [59.5, 52.0]], ['800 Meter Run', 'run', 8, [129, 111]],
    ['1500 Meter Run', 'run', 12, [263, 226]], ['3000 Meter Steeplechase', 'run', 12, [620, 535]], ['5000 Meter Run', 'run', 14, [990, 850]],
    ['10000 Meter Run', 'run', 14, [2060, 1780]], ['4x100 Meter Relay', 'relay', 8, [45.5, 40.2]], ['4x400 Meter Relay', 'relay', 8, [222, 191]],
    ['High Jump', 'field', 10, [1.75, 2.10]], ['Pole Vault', 'field', 10, [4.10, 5.20]], ['Long Jump', 'field', 10, [6.10, 7.40]],
    ['Triple Jump', 'field', 10, [12.80, 15.20]], ['Shot Put', 'field', 10, [15.20, 17.80]], ['Discus Throw', 'field', 10, [52.0, 58.0]],
    ['Hammer Throw', 'field', 10, [60.0, 65.0]], ['Javelin Throw', 'field', 10, [50.0, 68.0]]
  ];
  /* Combined events: a small field so the coordinators have something to run once they're turned on. */
  var CE = {
    indoor:[['W', 'Pentathlon', [['60 Meter Hurdles', 'run', 8.75], ['High Jump', 'field', 1.70], ['Shot Put', 'field', 12.5], ['Long Jump', 'field', 5.90], ['800 Meter Run', 'run', 140]]],
            ['M', 'Heptathlon', [['60 Meter Dash', 'run', 7.05], ['Long Jump', 'field', 7.10], ['Shot Put', 'field', 13.8], ['High Jump', 'field', 1.98], ['60 Meter Hurdles', 'run', 8.20], ['Pole Vault', 'field', 4.70], ['1000 Meter Run', 'run', 162]]]],
    outdoor:[['W', 'Heptathlon', [['100 Meter Hurdles', 'run', 14.0], ['High Jump', 'field', 1.70], ['Shot Put', 'field', 12.5], ['200 Meter Dash', 'run', 25.0], ['Long Jump', 'field', 5.90], ['Javelin Throw', 'field', 40.0], ['800 Meter Run', 'run', 140]]],
             ['M', 'Decathlon', [['100 Meter Dash', 'run', 10.9], ['Long Jump', 'field', 7.10], ['Shot Put', 'field', 13.8], ['High Jump', 'field', 1.98], ['400 Meter Dash', 'run', 49.5], ['110 Meter Hurdles', 'run', 14.6], ['Discus Throw', 'field', 42.0], ['Pole Vault', 'field', 4.70], ['Javelin Throw', 'field', 58.0], ['1500 Meter Run', 'run', 275]]]]
  };

  /* Build the meet program text for one meet, starting today. */
  function program(kind, firstStart){
    /* Open field events are left out: clerking rarely checks those athletes in. Field events still come in the combined events. */
    var list = (kind === 'indoor' ? INDOOR : OUTDOOR).filter(function(e){ return e[1] !== 'field'; }), pools = { W:pool('W'), M:pool('M') }, cursor = { W:0, M:0 };
    var today = new Date(); today.setHours(12, 0, 0, 0);
    var days = [new Date(today), new Date(today.getTime() + 864e5)];
    var lines = ['Practice Meet - ' + (kind === 'indoor' ? 'Indoor 200m' : 'Outdoor 400m') + ' - ' + md(days[0])], num = 1;
    var t = [firstStart, firstStart], field = [firstStart, firstStart];
    function take(g, n){ var p = pools[g], out = []; for (var i = 0; i < n; i++){ out.push(p[cursor[g] % p.length]); cursor[g]++; } return out; }
    function evLine(g, name, day, min){ var d = days[day]; lines.push('Event ' + (num++) + '  ' + (g === 'W' ? 'Women' : 'Men') + ' ' + name + '   ' + DOW[d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm(min)); }
    function heats(g, name, kindE, per, base, n){
      for (var h = 1; h <= (n || 2); h++){
        lines.push((kindE === 'field' ? 'Flight ' : 'Heat ') + h + ' of ' + (n || 2) + ' Finals');
        if (kindE === 'relay'){
          var teams = TEAMS.slice(0, per);
          teams.forEach(function(tm, i){
            var ms = pools[g].filter(function(a){ return a.team === tm; }).slice(h * 4 - 4, h * 4);
            lines.push('  ' + (i + 1) + '  ' + tm + "  '" + (h === 1 ? 'A' : 'B') + "'" + pad('', 30) + seed('run', base, i + (h - 1) * per));
            lines.push('     1) ' + pad(ms[0].name + ' ' + ms[0].yr, 24) + '2) ' + ms[1].name + ' ' + ms[1].yr);
            lines.push('     3) ' + pad(ms[2].name + ' ' + ms[2].yr, 24) + '4) ' + ms[3].name + ' ' + ms[3].yr);
          });
        } else {
          take(g, per).forEach(function(a, i){ lines.push('  ' + (i + 1) + '  ' + a.name + '  ' + a.yr + '  ' + a.team + '  ' + seed(kindE, base, i + (h - 1) * per)); });
        }
      }
    }
    /* Day 1 gets the first half of the program, day 2 the rest; track events every 10 minutes, field events
       every 75 minutes alongside them. Women and men alternate on each event. */
    var runs = list.filter(function(e){ return e[1] !== 'field'; }), fields = list.filter(function(e){ return e[1] === 'field'; });
    list.forEach(function(ev){
      var grp = ev[1] === 'field' ? fields : runs, day = grp.indexOf(ev) % 2;   // alternate, so each day has sprints, distance and a relay
      ['W', 'M'].forEach(function(g, gi){
        var name = ev[0] === 'HURDLES' ? (g === 'W' ? '100 Meter Hurdles' : '110 Meter Hurdles') : ev[0], base = ev[3][gi];
        if (ev[1] === 'field'){ evLine(g, name, day, field[day]); field[day] += 75; }
        else { evLine(g, name, day, t[day]); t[day] += ev[2] >= 12 ? 25 : 10; }
        heats(g, name, ev[1], ev[2], base);
      });
    });
    (CE[kind] || []).forEach(function(c, ci){
      var g = c[0], parts = c[2], cut = Math.ceil(parts.length / 2), ath = take(g, 12), at = [firstStart + 30, firstStart + 30];
      parts.forEach(function(p, i){
        var day = i < cut ? 0 : 1;
        evLine(g, c[1] + ' ' + p[0], day, at[day]); at[day] += 70;
        for (var h = 1; h <= 2; h++){
          lines.push((p[1] === 'field' ? 'Flight ' : 'Heat ') + h + ' of 2 Finals');
          ath.slice(h * 6 - 6, h * 6).forEach(function(a, k){ lines.push('  ' + (k + 1) + '  ' + a.name + '  ' + a.yr + '  ' + a.team + '  ' + seed(p[1], p[2], k)); });
        }
      });
    });
    return lines.join('\n');
  }

  var OFFICIALS = { headClerk:2, clerk:4, lineClerk:3, shoeCheck:2 };
  var LABEL = { headClerk:'Head Clerk', clerk:'Clerk', lineClerk:'Line Clerk', shoeCheck:'Shoe Check' };
  function athKey(l){ var n = function(x){ return String(x || '').toLowerCase().replace(/\s+/g, ' ').trim(); }; return l.bib ? 'b:' + String(l.bib).trim() : 'a:' + n(l.name) + '|' + n(l.team); }

  /* Build one practice meet (not yet saved). */
  function build(kind, who){
    var m = defaults(), parsed = MeetParse.parseHytek(program(kind, 9 * 60)), mapped = ProgramMap.map(parsed, {});
    m.name = 'Practice Meet – ' + (kind === 'indoor' ? 'Indoor 200m' : 'Outdoor 400m');
    mapped.groups.forEach(function(g, i){
      var tpl = m.templates[0].id;
      m.days.push({ id:uid('d'), name:'Day ' + (i + 1), date:g.iso || '', defaultTemplateId:tpl, mapId:null, events:g.events.map(function(e){ return ipNewEvent(e, tpl); }), status:{}, checkin:{}, staged:{}, run:{ state:'idle', log:[] } });
    });
    m.days.forEach(function(d){ d.events.forEach(function(e){ (e.entries || []).forEach(function(s){ (s.lanes || []).forEach(function(l){ if (l.members && l.members.length && !(l.legs && l.legs.some(Boolean))) l.legs = l.members.slice(0, 4).map(function(x){ return String(x).replace(/\s+(FR|SO|JR|SR)$/, ''); }); }); }); }); });
    m.officials = {};
    Object.keys(OFFICIALS).forEach(function(k){ m.officials[k] = []; for (var i = 1; i <= OFFICIALS[k]; i++) m.officials[k].push('Test ' + LABEL[k] + ' ' + i); });
    m.clerking = true;
    m.multi = { n:0, coords:[{ name:'Test CE Coordinator 1', scope:'Women' }, { name:'Test CE Coordinator 2', scope:'Men' }] };
    m.shoeKeep = 7;
    m.practice = true; m.practiceKind = kind; m.practiceV = VERSION;
    m.owner = who.id; m.ownerName = who.name || who.email || '';
    m.id = uid('meet_'); m.shared = true;
    m.settings.activeDayId = m.days[0] ? m.days[0].id : null;
    return normalize(m);
  }
  /* Umpiring officials, rulebook and lap counters live in their own documents. */
  function configs(m){
    var lay = { oval:DEF_POS('oval'), half:DEF_POS('half'), straight:DEF_POS('straight') }, assign = { oval:{}, half:{}, straight:{}, relay:{} }, umps = {};
    for (var i = 1; i <= 6; i++){
      umps['u' + i] = { name:'Test Umpire ' + i };
      Object.keys(lay).forEach(function(k){ var p = lay[k]; if (p.length) assign[k]['u' + i] = p[Math.min(p.length - 1, Math.round((i - 1) * (p.length - 1) / 5))]; });
    }
    var off = { facility:m.practiceKind, umpireCount:6, referee:'Test Referee', chief:'Test Chief Umpire', assistant:"Test Chief's Assistant", useAssistant:false, timing:'Test Timing',
      umpires:umps, assign:assign, overrides:{}, updatedAt:new Date().toISOString() };
    var roster = ['Test Lap Counter 1', 'Test Lap Counter 2', 'Test Lap Counter 3', 'Test Lap Counter 4'], lapcfg = {}, rc = 0;
    m.days.forEach(function(d){ d.events.forEach(function(e){
      if (LapCount.distanceOf(e.name) < 1500) return;
      (e.entries || []).forEach(function(s){
        var key = String(e.id).replace(/[\/~]/g, '_') + '_' + (s.num == null ? 1 : s.num), lanes = (s.lanes || []).filter(function(l){ return l.name || l.bib; });
        var n = Math.max(1, Math.min(4, Math.ceil(lanes.length / 4))), per = Math.ceil(lanes.length / n), slots = [];
        for (var j = 0; j < n; j++) slots.push({ id:'c' + (j + 1), pos:'lp' + ((rc++ % 4) + 1), aths:[] });
        lanes.forEach(function(l, k){ slots[Math.min(n - 1, Math.floor(k / per))].aths.push(athKey(l)); });
        lapcfg[key] = { evId:e.id, secNum:s.num, title:(e.gender ? e.gender + ' ' : '') + e.name, enabled:true, crossings:null, slots:slots, updated:Date.now() };
      });
    }); });
    return { umps:off, rules:{ book:'usatf', updatedAt:new Date().toISOString() }, laps:{ names:roster, updated:Date.now() }, lapcfg:lapcfg };
  }
  function DEF_POS(k){ try{ return Ump.defaultPositions()[k] || []; }catch(e){ return []; } }

  function upload(m){
    var db = Sync.db(), b = 'meets/' + m.id, c = configs(m);
    return Sync.upload(m).then(function(){
      var jobs = [db.doc(b + '/config/umps').set(c.umps), db.doc(b + '/config/rules').set(c.rules), db.doc(b + '/config/laps').set(c.laps)];
      Object.keys(c.lapcfg).forEach(function(k){ jobs.push(db.doc(b + '/lapcfg/' + k).set(c.lapcfg[k])); });
      return Promise.all(jobs);
    });
  }
  function saveLocal(m){
    var e = libEntry(m); e.shared = true; e.practice = true; e.owner = m.owner;
    m._sync = { d:{}, dt:{}, m:{}, t:{}, p:{}, k:{} };
    return Store.set('meet:' + m.id, m).then(function(){ return Store.set('library', LIB); });
  }

  /* Give this account its practice meets, once. Runs after sign-in on any device; the account remembers. */
  var running = false;
  function ensure(who){
    if (running || !who || !who.id || who.anon || !Sync.available() || Acct.suspended()) return Promise.resolve(false);
    running = true;
    return Acct.practiceDue().then(function(due){
      if (!due) return false;
      var made = [];
      return ['indoor', 'outdoor'].reduce(function(p, kind){
        return p.then(function(){ var m = build(kind, who); made.push(m); return upload(m).then(function(){ return saveLocal(m); }); });
      }, Promise.resolve()).then(function(){
        return Acct.practiceDone(made.map(function(m){ return m.id; }));
      }).then(function(){ render(); toast('Two practice meets were added to your Meets. Use them to try every role without building a meet.'); return true; });
    }).catch(function(err){ console.warn('practice meets', err); return false; }).then(function(v){ running = false; return v; });
  }

  /* Restart a practice meet: today's date, the first event 30 minutes from now, and nothing recorded yet. */
  function restart(){
    if (!M || !M.practice) return;
    var db = Sync.db(), id = M.id, starts = [];
    M.days.forEach(function(d){ d.events.forEach(function(e){ if (e.start != null) starts.push(e.start); }); });
    var first = starts.length ? Math.min.apply(null, starts) : 540, target = Math.ceil((realMin() + 30) / 5) * 5, shift = target - first;
    var today = new Date(); today.setHours(12, 0, 0, 0);
    M.days.forEach(function(d, i){
      var dt = new Date(today.getTime() + i * 864e5);
      d.date = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
      d.status = {}; d.checkin = {}; d.staged = {}; d.run = { state:'idle', log:[] };
      d.events.forEach(function(e){ if (e.start != null && i === 0) e.start = Math.max(0, Math.min(1439, e.start + shift)); e.actual = null; });
    });
    if (M.settings) M.settings.activeDayId = M.days[0] ? M.days[0].id : null;
    M.archived = false;
    var p = saveNow(); Sync.changed();
    if (db && M.shared){
      p = p.then(function(){
        return Promise.all(['calls', 'clears', 'finals', 'shoes', 'laprun'].map(function(c){
          return db.collection('meets/' + id + '/' + c).get().then(function(q){ return Promise.all(q.docs.map(function(d){ return db.doc('meets/' + id + '/' + c + '/' + d.id).delete().catch(function(){}); })); }, function(){});
        }));
      });
    }
    return p.then(function(){ render(); toast('Practice meet restarted. The first event is at ' + fmt(target) + ' today.'); });
  }
  /* Bring an older practice meet up to date when it's opened: fresh events in the same days, nothing recorded. */
  var upgrading = false;
  function upgrade(){
    if (upgrading || !M || !M.practice || (+M.practiceV || 1) >= VERSION) return;
    upgrading = true;
    var kind = M.practiceKind || (/indoor/i.test(M.name) ? 'indoor' : 'outdoor'), fresh = build(kind, { id:M.owner || '', name:M.ownerName || '' }), db = Sync.db(), id = M.id;
    M.days.forEach(function(d, i){
      var f = fresh.days[i]; if (!f) return;
      d.events = f.events; d.status = {}; d.checkin = {}; d.staged = {}; d.run = { state:'idle', log:[] };
    });
    M.practiceV = VERSION; M.practiceKind = kind;
    var p = saveNow(); Sync.changed();
    if (db && M.shared){
      var c = configs(M);
      p = p.then(function(){ return db.collection('meets/' + id + '/lapcfg').get(); }).then(function(q){
        return Promise.all(q.docs.map(function(d){ return db.doc('meets/' + id + '/lapcfg/' + d.id).delete().catch(function(){}); }));
      }, function(){}).then(function(){ return Promise.all(Object.keys(c.lapcfg).map(function(k){ return db.doc('meets/' + id + '/lapcfg/' + k).set(c.lapcfg[k]); })); });
    }
    p.then(function(){ upgrading = false; render(); toast('This practice meet was updated: field events now come only in the combined events.'); }, function(){ upgrading = false; });
  }
  return { ensure:ensure, restart:restart, upgrade:upgrade, build:build, program:program, configs:configs, VERSION:VERSION };
})();

window.__to = { get LIB(){ return LIB; }, get M(){ return M; }, Acct:Acct, Practice:Practice, Sync:Sync, nowMin:nowMin, callsForDay:callsForDay, render:render, queue:function(){ return queue; } };
})();

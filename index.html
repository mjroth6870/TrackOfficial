<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Track Officials</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E2A47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F7F3; --ink:#14202B; --muted:#5D6873; --line:#DCD7CE;
  --navy:#0E2A47; --navy-ink:#FFFFFF; --clay:#C23F37; --clay-soft:#F8E3E1; --teal:#17807A; --teal-soft:#DDF0EE;
  --amber:#B57A0B; --amber-soft:#FBEFD5; --focus:#2F6FDB;
  --c0:#2457A6; --c1:#6A4BB0; --c2:#C23F37; --c3:#17807A; --c4:#8A5A12;
  --radius:12px; --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#152029; --surface-2:#1A2731; --ink:#EAF0F4; --muted:#9AA8B4; --line:#2A3A47;
    --navy:#0A1F35; --clay:#E5675E; --clay-soft:#3A1F1E; --teal:#3FB7AE; --teal-soft:#14302E;
    --amber:#E3A637; --amber-soft:#3A2D12; --c0:#6E9BE6; --c1:#A58BE6; --c2:#E5675E; --c3:#3FB7AE; --c4:#D9A44E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --surface-2:#1A2731; --ink:#EAF0F4; --muted:#9AA8B4; --line:#2A3A47;
  --navy:#0A1F35; --clay:#E5675E; --clay-soft:#3A1F1E; --teal:#3FB7AE; --teal-soft:#14302E;
  --amber:#E3A637; --amber-soft:#3A2D12; --c0:#6E9BE6; --c1:#A58BE6; --c2:#E5675E; --c3:#3FB7AE; --c4:#D9A44E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--navy)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.brand span{font-size:12px;opacity:.75}
.clock{margin-left:auto;text-align:right;line-height:1.1}
.clock .t{font-size:26px;font-weight:700;letter-spacing:.5px}
.clock .s{font-size:11px;opacity:.8}
.clock .sim{display:inline-block;background:var(--amber);color:#1b1300;border-radius:4px;padding:0 5px;font-weight:700;font-size:10px;margin-left:4px}
.daypick{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 10px;max-width:42vw}
.daypick option{color:#14202B}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn[aria-pressed="false"]{opacity:.55}
nav.tabs{position:sticky;top:calc(var(--hdr,60px) + env(safe-area-inset-top,0px));z-index:19;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--clay)}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.go{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.warn{color:var(--clay);border-color:color-mix(in srgb,var(--clay) 40%,var(--line))}
.btn.sm{padding:4px 8px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input.f,select.f,textarea.f{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px;width:100%}
textarea.f{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:0 0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.ctype{color:#fff}
.line-badge{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:7px;background:var(--ink);color:var(--surface);font-weight:800;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--shadow);font-weight:600;max-width:92vw}

/* ---------- live board ---------- */
.live{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:960px){.live{grid-template-columns:1fr}}
.hero{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.hero .cd{font-size:44px;font-weight:800;line-height:1;grid-row:span 2}
.hero .cd small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:6px}
.hero .what{font-size:20px;font-weight:700}
.hero .sub{color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.calls{list-style:none;margin:0;padding:0}
.calls li{display:grid;grid-template-columns:78px 128px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.calls li:last-child{border-bottom:0}
.calls .tm{font-weight:800;font-size:16px;white-space:nowrap}
.calls .ev b{font-size:16px}
.calls .ev .m{font-size:13px;color:var(--muted)}
.calls li.done{opacity:.5}
.calls li.done .ev b{text-decoration:line-through;text-decoration-thickness:1px}
.calls li.due{background:var(--clay-soft)}
.calls li.over{background:var(--amber-soft)}
.calls li.nowline{display:block;padding:0;border:0;height:0;border-top:2px solid var(--clay);position:relative}
.calls li.nowline span{position:absolute;left:12px;top:-11px;background:var(--clay);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.stat{min-width:104px;justify-content:center}
.s-made{background:var(--teal-soft);color:var(--teal)}
.s-skipped{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.s-due{background:var(--clay);color:#fff}
.s-over{background:var(--amber);color:#1b1300}
.s-wait{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
@media (max-width:640px){
  .calls li{grid-template-columns:84px minmax(0,1fr) auto;gap:8px}
  .calls li .ct{grid-column:2;grid-row:1}
  .calls li .ev{grid-column:1 / -1;grid-row:2}
  .calls li .lb{grid-column:3;grid-row:1}
  .calls li .st{grid-column:1 / -1;grid-row:3}
  .hero .cd{font-size:34px}
}
table.evt{width:100%;border-collapse:collapse}
table.evt th,table.evt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.evt th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 7px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.made{background:var(--teal-soft);color:var(--teal);border-color:transparent;text-decoration:line-through}
.chip.skipped{color:var(--muted);text-decoration:line-through}
.chip.due{background:var(--clay);color:#fff;border-color:transparent}
.chip.over{background:var(--amber-soft);border-color:var(--amber)}
.mapbox{position:relative;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.mapbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:#fff;color:#14202B;border:2px solid #14202B;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.mk.hl{background:var(--clay);color:#fff;border-color:#fff;width:auto;min-width:34px;height:34px;font-size:16px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,63,55,.7)}50%{box-shadow:0 0 0 12px rgba(194,63,55,0)}}
@media (prefers-reduced-motion:reduce){.mk.hl{animation:none}}
.notes-mini{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:260px;overflow:auto}

/* ---------- schedule editor ---------- */
.sched-wrap{overflow:auto;max-height:calc(100vh - 230px);border-radius:var(--radius)}
table.ed{border-collapse:collapse;width:100%;min-width:1600px;table-layout:fixed}
table.ed th,table.ed td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.ed th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--surface-2);position:sticky;top:0;z-index:2}
table.ed input,table.ed select{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;width:100%;min-height:32px}
table.ed input:hover,table.ed select:hover{border-color:var(--line)}
table.ed input:focus,table.ed select:focus{border-color:var(--focus);background:var(--surface)}
table.ed td.calc{font-size:13px;color:var(--muted);white-space:normal;line-height:1.5}
table.ed td.calc span{white-space:nowrap}
table.ed td.calc b{color:var(--ink);font-weight:600}
table.ed tr.warn td{background:var(--amber-soft)}

/* ---------- maps ---------- */
.maps{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.maps{grid-template-columns:1fr}}
.maplist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;margin-bottom:8px;cursor:pointer}
.maplist button[aria-current="true"]{border-color:var(--navy);box-shadow:0 0 0 2px color-mix(in srgb,var(--navy) 30%,transparent)}
.maplist img{width:64px;height:40px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.mapedit .mapbox{cursor:crosshair;border:1px solid var(--line)}
.mk.ed{pointer-events:auto;cursor:pointer}

/* ---------- popup ---------- */
.ov{position:fixed;inset:0;background:rgba(8,14,20,.6);z-index:60;display:grid;place-items:center;padding:16px}
#layer .ov{z-index:70}
.pop{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.pop .bar{padding:14px 20px;color:#fff;display:flex;align-items:center;gap:10px}
.pop .bar .k{font-size:22px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.pop .bar .q{margin-left:auto;font-weight:700;opacity:.9;font-size:13px}
.pop .body{padding:18px 20px 20px}
.pop .ev{font-size:30px;font-weight:800;line-height:1.15}
.pop .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 14px;color:var(--muted);font-size:14px}
.pop .meta b{color:var(--ink)}
.pop .script{background:var(--surface-2);border-left:4px solid var(--navy);padding:12px 14px;border-radius:8px;font-size:18px;line-height:1.45;margin-bottom:14px}
.pop .mapbox{max-width:540px;margin:0 auto}
.pop .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pop .acts .btn{min-height:48px;padding:10px 18px;font-size:16px}
.modal{width:min(560px,100%);background:var(--surface);border-radius:14px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

/* ---------- setup ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.list-row{display:grid;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.day-row{grid-template-columns:minmax(0,1fr) 150px}
.day-row > div.row{justify-content:flex-end}
.call-row{grid-template-columns:minmax(0,1fr) 110px auto}

.tpl{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12px}

/* ---------- run control ---------- */
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border-left:6px solid var(--muted)}
.runbar .st{font-weight:800;font-size:16px}
.runbar .sub{color:var(--muted);font-size:13px}
.runbar.running{border-left-color:var(--teal)}
.runbar.paused{border-left-color:var(--amber);background:var(--amber-soft)}
.runbar.ended{border-left-color:var(--line)}
.runbar .btn{min-height:44px;padding:8px 16px;font-size:15px}
.btn.pause{background:var(--amber);border-color:var(--amber);color:#1b1300}
.runpill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;letter-spacing:.3px;border:0;cursor:pointer;white-space:nowrap}
.runpill.idle{background:rgba(255,255,255,.14);color:#fff}
.runpill.running{background:var(--teal);color:#fff}
.runpill.paused{background:var(--amber);color:#1b1300;animation:blink 1.6s ease-in-out infinite}
.runpill.ended{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.runpill.paused{animation:none}}
.hero.paused .cd{color:var(--amber)}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--navy);background:var(--surface-2)}

/* ---------- meet program import ---------- */
.modal.wide{width:min(1000px,100%);max-height:calc(100vh - 32px);overflow:auto}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin:10px 0}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.srcs div{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface-2);font-size:13px}
.srcs b{display:block;font-size:14px;margin-bottom:2px}
.igroup{border:1px solid var(--line);border-radius:10px;margin-top:14px;overflow:hidden}
.igroup.off{opacity:.55}
.igroup .gh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.igroup .gh b{font-size:16px}
.igroup .gh select{width:auto;min-height:32px;padding:4px 8px}
.igroup .gm{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.itbl{max-height:300px;overflow:auto}
.itbl table{width:100%;border-collapse:collapse;font-size:13px}
.itbl th,.itbl td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.itbl th{position:sticky;top:0;background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.itag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.itag.upd{background:var(--amber-soft);color:var(--amber)}
.itag.miss{background:var(--clay-soft);color:var(--clay)}
details.sl{margin-top:6px}
details.sl summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--navy)}
:root[data-theme="dark"] details.sl summary{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) details.sl summary{color:var(--ink)}}
.sltbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.sltbl td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sltbl tr.sh td{font-weight:800;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.sltbl td.ln{width:30px;font-weight:800;text-align:center}
.sltbl small{color:var(--muted)}

/* ---------- athlete check-in ---------- */
:root{--ci-in:#FFD84D;--ci-in-ink:#2B2100;--ci-scr:#D63B3B;--ci-scr-ink:#FFFFFF}
.ci-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ci-top input[type=search]{flex:1 1 220px;min-width:0}
.ci-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.ci-legend span{display:inline-flex;align-items:center;gap:6px}
.ci-legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.ci-ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.ci-evh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;cursor:pointer}
.ci-evh .chev{color:var(--muted);transition:transform .15s}
.ci-ev.open .ci-evh .chev{transform:rotate(90deg)}
.ci-num{font-size:12px;color:var(--muted);min-width:64px;line-height:1.25}
.ci-name{flex:1;min-width:0;font-size:17px;font-weight:800;line-height:1.2}
.ci-name small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.ci-cnt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ci-pill{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--surface-2)}
.ci-pill.in{background:var(--ci-in);color:var(--ci-in-ink);border-color:transparent}
.ci-pill.scr{background:var(--ci-scr);color:var(--ci-scr-ink);border-color:transparent}
.ci-pill.done{background:var(--teal);color:#fff;border-color:transparent}
.ci-sec{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.ci-rows{display:flex;flex-direction:column}
.ci-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 14px;cursor:pointer;min-height:58px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.ci-row:hover{background:var(--surface-2)}
.ci-row .ln{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--navy);color:#fff;font-weight:800;font-size:16px}
.ci-row .who b{display:block;font-size:16px}
.ci-row .who small{display:block;color:var(--muted);font-size:13px}
.ci-row .sd{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ci-row .st{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;min-width:92px;text-align:right;color:var(--muted)}
.ci-row.in{background:var(--ci-in);color:var(--ci-in-ink)}
.ci-row.in .who small,.ci-row.in .sd,.ci-row.in .st{color:var(--ci-in-ink)}
.ci-row.scr{background:var(--ci-scr);color:var(--ci-scr-ink)}
.ci-row.scr .who b{text-decoration:line-through;text-decoration-thickness:2px}
.ci-row.scr .who small,.ci-row.scr .sd,.ci-row.scr .st{color:var(--ci-scr-ink)}
.ci-row.in .ln,.ci-row.scr .ln{background:rgba(0,0,0,.72)}
@media (max-width:560px){.ci-row{grid-template-columns:40px minmax(0,1fr) auto}.ci-row .sd{display:none}.ci-row .st{min-width:0}}
.ci-heat{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ci-hh{padding:14px 16px;border-bottom:1px solid var(--line)}
.ci-hh h2{font-size:26px;margin:2px 0 4px}
.ci-hh .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.ci-hh .meta b{color:var(--ink)}
.ci-prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:8px 0 10px}
.ci-prog span{display:block;height:100%;background:var(--teal)}
.ci-bar{position:sticky;bottom:0;display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);margin-top:10px}
.ci-bar .sum{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:700}
.ci-bar .btn{min-height:48px;font-size:16px}
.sltbl tr.in td{background:var(--ci-in);color:var(--ci-in-ink)}
.sltbl tr.scr td{background:var(--ci-scr);color:var(--ci-scr-ink);text-decoration:line-through}
.sltbl tr.in small,.sltbl tr.scr small{color:inherit}

/* ---------- start line ---------- */
.sl-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface);min-height:56px}
.sl-row .ln{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--navy);color:#fff;font-weight:800;font-size:16px}
.sl-row .who b{display:block;font-size:16px}
.sl-row .who small{display:block;color:var(--muted);font-size:13px}
.sl-row .st{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-align:right}
.sl-row.in{background:var(--ci-in);color:var(--ci-in-ink)}
.sl-row.scr{background:var(--ci-scr);color:var(--ci-scr-ink)}
.sl-row.scr .who b{text-decoration:line-through;text-decoration-thickness:2px}
.sl-row.in .who small,.sl-row.scr .who small{color:inherit}
.sl-row.in .ln,.sl-row.scr .ln{background:rgba(0,0,0,.72)}
.sl-row.none .st{color:var(--clay)}
.sl-row .st{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sl-late{border:2px solid var(--amber);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px;white-space:nowrap;touch-action:manipulation}
.sl-late:hover{background:var(--amber-soft)}
.late-tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.5px;padding:1px 7px;border-radius:999px;background:#2B2100;color:var(--ci-in);vertical-align:middle;margin-left:6px}
.sl-undo{border:1px solid rgba(0,0,0,.35);background:transparent;color:inherit;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer}
.sl-stage{width:100%;min-height:64px;font-size:20px;font-weight:900;letter-spacing:.5px;border-radius:12px;border:0;background:var(--teal);color:#fff;cursor:pointer}
.sl-stage:hover{filter:brightness(1.05)}
.sl-done{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:14px;border-radius:12px;background:var(--teal-soft);color:var(--teal);font-weight:800;font-size:17px}
.sl-done.skip{background:var(--surface-2);color:var(--muted)}
.sl-lock{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.sl-warn{padding:10px 16px;background:var(--amber-soft);border-top:1px solid var(--line);font-size:14px}
.ci-pill.staged{background:var(--teal);color:#fff;border-color:transparent}

/* ---------- live sync ---------- */
.syncpill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;letter-spacing:.3px;border:0;cursor:pointer;white-space:nowrap}
.syncpill.ok{background:rgba(63,183,174,.22);color:#9FE6DF}
.syncpill.busy{background:rgba(255,255,255,.14);color:#fff}
.syncpill.wait{background:var(--amber);color:#1b1300}
.syncpill.local{background:rgba(255,255,255,.08);color:rgba(255,255,255,.75)}
.tag.live{background:var(--teal)}
.shared-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- meets library ---------- */
.meetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.meet{padding:16px;display:flex;flex-direction:column;gap:6px}
.meet h3{font-size:17px;margin:0}
.meet.current{border-color:var(--navy);box-shadow:0 0 0 2px color-mix(in srgb,var(--navy) 25%,transparent),var(--shadow)}
.meet.archived{background:var(--surface-2)}
.meet .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--navy);color:#fff;vertical-align:middle;margin-left:6px}
.tag.arch{background:var(--line);color:var(--muted)}
.nomeet .daypick,.nomeet #runPill,.nomeet #btnSound,.nomeet #btnVoice{display:none}

@media print{
  header.top,nav.tabs,.toolbar,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:0}
  .sched-wrap{max-height:none;overflow:visible}
  main{padding:0}
}

/* ---------- combined: type, status tokens ---------- */
/* Layout: sticky navy header (meet · day · role) over role-specific tabs; single working column per view, sheets slide up for reports. */
:root{
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --flag:#F2C230; --flag-ink:#3B2D00;
  --st-reported:#946C00; --st-reported-bg:#FFF4CC;
  --st-ref:#B4560C; --st-ref-bg:#FFE8D4;
  --st-dq:#B42433; --st-dq-bg:#FDE1E3;
  --st-ok:#23774D; --st-ok-bg:#DCF2E5;
  --st-closed:#5A6578; --st-closed-bg:#E8EBF0;
  --st-protest:#6A3FB3; --st-protest-bg:#ECE3FB;
  --g-clerk:#17807A; --g-ump:#B57A0B; --g-meet:#6A4BB0;
  --scrim:rgba(8,14,20,.55);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --st-reported:#F2C230; --st-reported-bg:#3A3010; --st-ref:#F39A52; --st-ref-bg:#3D2615; --st-dq:#FF7A86; --st-dq-bg:#401A20;
  --st-ok:#5FD394; --st-ok-bg:#16352A; --st-closed:#A5B0C3; --st-closed-bg:#222D44; --st-protest:#B997FF; --st-protest-bg:#2D2147;
  --g-clerk:#3FB7AE; --g-ump:#E3A637; --g-meet:#A58BE6; --scrim:rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  --st-reported:#F2C230; --st-reported-bg:#3A3010; --st-ref:#F39A52; --st-ref-bg:#3D2615; --st-dq:#FF7A86; --st-dq-bg:#401A20;
  --st-ok:#5FD394; --st-ok-bg:#16352A; --st-closed:#A5B0C3; --st-closed-bg:#222D44; --st-protest:#B997FF; --st-protest-bg:#2D2147;
  --g-clerk:#3FB7AE; --g-ump:#E3A637; --g-meet:#A58BE6; --scrim:rgba(0,0,0,.65);
}
html,body{font-family:var(--body)}
.brand b,h2,.hero .what,.ci-name,.pop .ev,.section-title,.qr-info>b,.athn{font-family:var(--display);letter-spacing:.01em}
h2{font-size:22px;text-wrap:balance}
.brand b{font-size:19px;font-weight:700}
.ci-name{font-size:19px;font-weight:700}
.ci-hh h2{font-size:30px;font-weight:700;line-height:1.05}
.hero .what{font-size:22px}
.lane,.ci-row .ln,.sl-row .ln,.st-row .ln{font-family:var(--display)}
nav.tabs button{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
body[data-group="clerk"] nav.tabs button[aria-selected="true"]{border-bottom-color:var(--g-clerk)}
body[data-group="ump"] nav.tabs button[aria-selected="true"]{border-bottom-color:var(--flag)}
body[data-group="meet"] nav.tabs button[aria-selected="true"]{border-bottom-color:var(--g-meet)}
body:not([data-group="clerk"]) #btnSound,body:not([data-group="clerk"]) #btnVoice{display:none}
.badge{background:var(--clay);color:#fff;border-radius:999px;font-family:var(--body);font-size:12px;padding:1px 7px;line-height:1.5;letter-spacing:0}
.mono-cap{font-size:12px;font-weight:800;letter-spacing:.5px}

/* role chip + role picker */
.rolechip{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;border-left:5px solid var(--muted);max-width:44vw;min-width:0}
.rolechip small{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.75}
.rolechip b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rolechip.g-clerk{border-left-color:var(--g-clerk)} .rolechip.g-ump{border-left-color:var(--flag)} .rolechip.g-meet{border-left-color:var(--g-meet)} .rolechip.g-none{border-left-color:var(--clay);animation:blink 1.6s ease-in-out infinite}
.modal.wide2{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto}
.rgrp{margin-top:12px}
.rgrp-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.rcard{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:var(--surface)}
.rcard.g-clerk{border-left-color:var(--g-clerk)} .rcard.g-ump{border-left-color:var(--flag)} .rcard.g-meet{border-left-color:var(--g-meet)}
.rcard:has(input:checked){background:var(--surface-2);box-shadow:0 0 0 2px var(--focus)}
.rcard b{display:block;font-family:var(--display);font-size:17px}
.rcard small{display:block;color:var(--muted);font-size:12px}
.rcard input{margin-top:4px}

/* athlete status */
.stchip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.sc-out{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.sc-in,.sc-late{background:var(--ci-in);color:var(--ci-in-ink)}
.sc-late{box-shadow:inset 0 0 0 2px var(--amber)}
.sc-track{background:var(--teal);color:#fff}
.sc-raced{background:var(--navy);color:#fff}
:root[data-theme="dark"] .sc-raced{background:#2A4A70}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sc-raced{background:#2A4A70}}
.sc-review{background:var(--st-ref-bg);color:var(--st-ref);border-color:currentColor}
.sc-dq,.sc-dqfinal{background:var(--st-dq);color:#fff}
.sc-nodq{background:var(--st-ok-bg);color:var(--st-ok)}
.sc-final{background:var(--st-ok);color:#fff}
.sc-dns,.sc-skip{background:var(--surface-2);color:var(--clay);border-color:var(--clay)}
.sc-scr{background:var(--ci-scr);color:var(--ci-scr-ink);text-decoration:line-through}
.st-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);background:var(--surface)}
.st-row .ln{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--navy);color:#fff;font-weight:800;font-size:17px}
.st-row .who b{display:block}
.st-row .who small{display:block;color:var(--muted);font-size:13px}
.tsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tsum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.tsum div.hot{border-color:var(--st-ref);background:var(--st-ref-bg)}
.tsum b{font-family:var(--display);font-size:30px;line-height:1}
.tsum b small{font-size:17px;color:var(--muted);font-weight:600}
.tsum span{color:var(--muted);font-size:13px}
.evpipe-wrap{padding:0 14px 12px;overflow-x:auto}
.evpipe{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(84px,1fr));gap:4px;min-width:520px}
.evpipe li{border-radius:7px;padding:5px 8px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.evpipe b{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.evpipe small{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.evpipe li.st-done{background:var(--teal-soft);border-color:transparent} .evpipe li.st-done b{color:var(--teal)}
.evpipe li.st-now{background:var(--ci-in);border-color:transparent} .evpipe li.st-now b,.evpipe li.st-now small{color:var(--ci-in-ink)}
.evpipe li.st-skip{opacity:.55}
.ci-ev.fin .ci-evh{background:var(--teal-soft)}
.athcard{padding:12px 14px}
.athn{font-size:20px;display:block}
.pipe{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap}
.pipe li{display:flex;flex-direction:column;align-items:flex-start;position:relative;padding:0 16px 0 0;min-width:84px;font-size:12px}
.pipe li::after{content:"";position:absolute;left:12px;right:0;top:5px;height:2px;background:var(--line)}
.pipe li:last-child::after{display:none}
.pipe .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1;margin-bottom:3px}
.pipe b{font-weight:700}
.pipe small{color:var(--muted)}
.pipe .st-done .dot{background:var(--st-ok);border-color:var(--st-ok)}
.pipe .st-done::after{background:var(--st-ok)}
.pipe .st-now .dot{background:var(--flag);border-color:var(--st-reported)}
.pipe .st-now b{color:var(--st-ref)}
.pipe .st-skip .dot{border-style:dashed}
.pipe .st-skip b,.pipe .st-todo b{color:var(--muted);font-weight:500}

/* umpire heat card */
.clerkline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.cl-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--g-clerk);margin-right:2px}
.lanes{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lanes td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.lanes tr:first-child td{border-top:0}
.lanes td:first-child{padding-left:14px;width:46px}
.lanes td:last-child{padding-right:14px;text-align:right;white-space:nowrap}
.lane{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;background:var(--navy);color:#fff;font-weight:700;font-size:18px;border-radius:5px}
.heat-lanes .lane{min-width:36px;height:36px;font-size:21px}
.ath{font-weight:700}
.ath small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.ln-st{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-radius:999px;padding:1px 8px}
.ln-st.in{background:var(--ci-in);color:var(--ci-in-ink)}
.ln-st.out{background:var(--surface-2);color:var(--clay);border:1px solid var(--line)}
.ln-st.scr{background:var(--ci-scr);color:var(--ci-scr-ink)}
.lanes tr.lr-in td:first-child{box-shadow:inset 4px 0 0 var(--ci-in)}
.lanes tr.lr-scr{opacity:.55}
.lanes tr.lr-scr .ath{text-decoration:line-through}
.lanes tr.lr-scr .lane{background:var(--muted)}
.lanes tr.lr-out .lane{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.cell-chips{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:560px){.col-seed{display:none}}
.upill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.upill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-reported{color:var(--st-reported);background:var(--st-reported-bg)}
.s-ref{color:var(--st-ref);background:var(--st-ref-bg)}
.s-dq{color:var(--st-dq);background:var(--st-dq-bg)}
.s-ok{color:var(--st-ok);background:var(--st-ok-bg)}
.s-closed{color:var(--st-closed);background:var(--st-closed-bg)}
.s-protest{color:var(--st-protest);background:var(--st-protest-bg)}
.s-final{color:#fff;background:var(--navy)}
.flagbtn{border:0;background:var(--flag);color:var(--flag-ink);border-radius:7px;padding:7px 11px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;min-height:36px}
.btn.flag{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.btn.danger{background:var(--st-dq);border-color:var(--st-dq);color:#fff}
.btn.good{background:var(--st-ok);border-color:var(--st-ok);color:#fff}
.btn.purple{background:var(--st-protest);border-color:var(--st-protest);color:#fff}
.heat-go{font-size:16px;min-height:48px}
.heat-status{margin:0;padding:12px 16px;border-top:1px solid var(--line);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.heat-status.ok{background:var(--st-ok-bg);color:var(--st-ok)}
.heat-status.has-calls{background:var(--st-reported-bg);color:var(--ink)}
.ok-count{color:var(--st-ok);font-weight:700;text-transform:none;letter-spacing:0}
.linkbtn{border:0;background:none;text-decoration:underline;cursor:pointer;color:inherit;font-weight:700;padding:0}
.banner{background:var(--st-reported-bg);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.warnb{background:var(--amber-soft);border-left:5px solid var(--amber)}
.welcome{background:var(--st-ok-bg);color:var(--st-ok);border-radius:9px;padding:10px 12px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:12px}
.welcome b{color:var(--ink)}
.notice h3{margin:0 0 6px}
.notice{margin-bottom:12px}
.me-chip{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-left:auto;min-width:0}
.me-chip.block{margin:0 0 12px}
.me-chip>span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.me-chip small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.me-chip b{font-weight:700;overflow-wrap:anywhere}
.me-chip>span.lane{display:inline-grid}
.me-post{border-left:1px solid var(--line);padding-left:12px}
.me-chip.unset{background:var(--st-reported-bg);border-color:transparent;font-size:14px}
.me-chip.unset>span{display:inline}
@media (max-width:560px){.me-chip{margin-left:0;width:100%}}

/* queues */

<script>/* Workbook importer — shared by the app (in-browser) and the build script (Node).

var ClerkImporter = (function () {
  var SKIP = /^(instructions|map|maps|clerking notes|notes|uniforms?)$/i;
  var CALL_HDR = /^\s*(.*?)\s*-\s*(\d+)\s*$/;

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function normGender(g) {
    g = String(g == null ? '' : g).trim().toLowerCase();
    if (!g) return '';

    if (/^(w|f|female|women|woman|girls?)$/.test(g)) return 'Women';
    if (/^(c|x|combined|mixed|coed)$/.test(g)) return 'Mixed';

  function cellText(ws, r, c, XLSX) {

<script>
(function(){

/* =====================================================================
   Storage — IndexedDB (big enough for map images), localStorage fallback
   ===================================================================== */
var Store = (function(){
  var dbp = null;
  function db(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      try{
        var r = indexedDB.open('track-officials', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  function run(mode, fn){
    return db().then(function(d){ return new Promise(function(res, rej){
      var t = d.transaction('kv', mode), out = null, q = fn(t.objectStore('kv'));
      if (q && mode === 'readonly') q.onsuccess = function(){ out = q.result == null ? null : q.result; };
      t.oncomplete = function(){ res(out); }; t.onerror = function(){ rej(t.error); };
    });});
  }
  function get(k){ return run('readonly', function(st){ return st.get(k); }).catch(function(){ try{ return JSON.parse(localStorage.getItem('cc:' + k) || 'null'); }catch(e){ return null; } }); }
  function set(k, v){ return run('readwrite', function(st){ st.put(v, k); }).catch(function(){ try{ localStorage.setItem('cc:' + k, JSON.stringify(v)); }catch(e){ toast('Could not save — storage is full'); } }); }
  function del(k){ return run('readwrite', function(st){ st.delete(k); }).catch(function(){ try{ localStorage.removeItem('cc:' + k); }catch(e){} }); }
  return { get:get, set:set, del:del };
})();

/* =====================================================================
   State
   ===================================================================== */
var M = null;                 // the open meet
var LIB = { currentId:null, meets:[] };   // index of every meet stored on this device
var UI = { slWho:(function(){ try{ return localStorage.getItem('cc.slWho') || ''; }catch(e){ return ''; } })(), ciMode:(function(){ try{ return localStorage.getItem('cc.ciMode') || 'heat'; }catch(e){ return 'heat'; } })(), view:'live', liveMode:'calls', hideDone:false, clerk:'', mapId:null, mkLabel:'A', schedDay:null };
var queue = [], snoozed = {}, firedThisSession = {}, lastTick = -1;
var saveTimer = null;
function libEntry(m){
  var e = LIB.meets.filter(function(x){ return x.id === m.id; })[0];
  if (!e){ e = { id:m.id, created:Date.now(), archived:false }; LIB.meets.push(e); }
  e.name = m.name || 'Untitled meet'; e.updated = Date.now(); e.days = m.days.length;
  e.events = m.days.reduce(function(n, d){ return n + d.events.length; }, 0);
  e.dates = m.days.map(function(d){ return d.date; }).filter(Boolean).sort();
  return e;
}
function saveNow(){
  clearTimeout(saveTimer);
  if (!M) return Store.set('library', LIB);
  libEntry(M); LIB.currentId = M.id;
  var p = Promise.all([Store.set('meet:' + M.id, M), Store.set('library', LIB)]);
  Sync.changed();
  return p;
}
function save(){ if (!M) return; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }

function uid(p){ return (p||'') + Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(s, el){ return (el||document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }

function defaults(){
  return {
    v:1, name:'New Meet', templates:[
      { id:'t60', name:'60 / 45 / 15 / 5 min', calls:[{label:'1st Call',min:60},{label:'2nd Call',min:45},{label:'Report Time',min:15},{label:'Leave Clerking',min:5}] },
      { id:'t30', name:'30 / 20 / 15 / 5 min', calls:[{label:'First Call',min:30},{label:'Second Call',min:20},{label:'Report Time',min:15},{label:'Leave Clerking',min:5}] }
    ],
    days:[], notes:[], maps:[],
    settings:{ sound:true, voice:false, popups:true, catchup:3, activeDayId:null, sim:{on:false, startMin:840, rate:1, realAt:0} }
  };
}
function normalize(m){
  var d = defaults();
  m = m || d;
  m.templates = m.templates || d.templates; m.days = m.days || []; m.notes = m.notes || []; m.maps = m.maps || [];
  m.settings = Object.assign({}, d.settings, m.settings || {});
  m.settings.sim = Object.assign({}, d.settings.sim, m.settings.sim || {});
  m.days.forEach(function(day){ day.status = day.status || {}; day.events = day.events || []; day.run = day.run || { state:'idle', log:[] }; day.checkin = day.checkin || {}; Object.keys(day.checkin).forEach(function(k){ if (k.indexOf('|') < 0) delete day.checkin[k]; }); day.staged = day.staged || {}; day.run.log = day.run.log || []; });
  m.id = m.id || uid('meet_');
  m.maps.forEach(function(mp){ mp.markers = mp.markers || {}; });
  m.officials = m.officials || {};
  [['headClerk',2],['clerk',4],['lineClerk',3],['shoeCheck',2]].forEach(function(r){ if (!Array.isArray(m.officials[r[0]])) m.officials[r[0]] = new Array(r[1]).fill(''); });
  [['headClerk',2],['clerk',10],['lineClerk',4],['shoeCheck',2]].forEach(function(r){ var l = m.officials[r[0]]; while (l.length > r[1] && !String(l[l.length-1] || '').trim()) l.pop(); });
  m.days.forEach(function(day){ day.events.forEach(function(e){ if (e.athletes == null) e.athletes = ''; if (e.lineClerk == null) e.lineClerk = '';
    var h = String(e.heats||'').match(/^(\d+)\s*[-\/]\s*(\d+)$/); if (h && !e.athletes){ e.heats = h[1]; e.athletes = h[2]; } }); });
  return m;
}

/* =====================================================================
   Time
   ===================================================================== */
function realMin(){ var n = new Date(); return n.getHours()*60 + n.getMinutes() + n.getSeconds()/60; }
function nowMin(){
  if (!M) return realMin();
  var s = M.settings.sim;
  if (!s.on) return realMin();
  return s.startMin + (Date.now() - s.realAt)/60000 * (s.rate||1);
}
function fmt(min){
  if (min == null || isNaN(min)) return '—';
  min = Math.floor(((min % 1440) + 1440) % 1440 + 1e-6);
  var h = Math.floor(min/60), m = min % 60, ap = h >= 12 ? 'PM' : 'AM';
  var hh = h % 12 || 12;
  return hh + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
}
function fmtClock(min){
  var tot = Math.floor(min*60), h = Math.floor(tot/3600)%24, m = Math.floor(tot/60)%60, s = tot%60;
  var hh = h % 12 || 12;
  return hh + ':' + (m<10?'0':'') + m + ':' + (s<10?'0':'') + s + ' ' + (h>=12?'PM':'AM');
}
function toHHMM(min){ if (min == null) return ''; var h = Math.floor(min/60), m = Math.round(min%60); return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function fromHHMM(s){ if (!s) return null; var p = s.split(':'); return (+p[0])*60 + (+p[1]); }
function countdown(mins){
  var secs = Math.max(0, Math.round(mins*60)), h = Math.floor(secs/3600), m = Math.floor(secs/60)%60, s = secs%60;
  return (h ? h + ':' + (m<10?'0':'') : '') + m + ':' + (s<10?'0':'') + s;
}

/* =====================================================================

   ===================================================================== */
function day(id){ return M.days.filter(function(d){ return d.id === id; })[0] || null; }
function activeDay(){ return day(M.settings.activeDayId) || M.days[0] || null; }
function tpl(id){ return M.templates.filter(function(t){ return t.id === id; })[0] || null; }
function mapById(id){ return M.maps.filter(function(m){ return m.id === id; })[0] || null; }
function dayMap(d){ return (d && mapById(d.mapId)) || M.maps[0] || null; }
function evTpl(d, ev){ return tpl(ev.templateId) || tpl(d.defaultTemplateId) || M.templates[0] || {calls:[]}; }
function evTitle(ev){ return (ev.gender ? ev.gender + ' ' : '') + ev.name; }
function callColor(i){ return 'var(--c' + Math.min(i,4) + ')'; }

function callsForDay(d){
  var out = [];
  if (!d) return out;
  d.events.forEach(function(ev){
    if (ev.start == null) return;
    evTpl(d, ev).calls.forEach(function(c, i){
      out.push({ key: ev.id + '|' + i, ev: ev, idx: i, call: c, t: ev.start - c.min });

function statusOf(d, c, now){

  return { id:uid('e'), num:e.num, name:e.name, fullName:e.fullName, gender:e.gender, startType:e.startType, line:e.line, clerk:'', lineClerk:'', heats:e.heats, athletes:e.athletes, round:e.round, start:e.start, templateId:tpl, entries:e.entries, note:e.note };
}
function ipCommit(){
  var groups = IMP.mapped.groups.filter(function(g){ return g.on; });
  if (!groups.length) return ipMsg('Tick at least one day to import.', true);
  var stats = { added:0, updated:0, days:0 }, firstDay = null;
  function newDay(g, maps, tplDefault){
    var d = { id:uid('d'), name:g.dayName, date:g.iso || '', defaultTemplateId:g.tpl || tplDefault, mapId:maps[0] ? maps[0].id : null, events:[], status:{}, run:{ state:'idle', log:[] } };
    g.events.forEach(function(e){ d.events.push(ipNewEvent(e, d.defaultTemplateId)); stats.added++; });
    stats.days++; firstDay = firstDay || d.id;
    return d;
  }
  if (IMP.asNew){
    var m = defaults(); m.name = ($('#ipName').value || '').trim() || IMP.mapped.meet.name || 'New meet';
    if (M && $('#ipReuse') && $('#ipReuse').checked){ var c = JSON.parse(JSON.stringify(M)); m.templates = c.templates; m.maps = c.maps; m.officials = c.officials; m.notes = c.notes; ['sound','voice','popups','catchup','theme'].forEach(function(k){ m.settings[k] = c.settings[k]; }); }
    else groups.forEach(function(g){ if (!m.templates.some(function(t){ return t.id === g.tpl; })) g.tpl = m.templates[0].id; });
    groups.forEach(function(g){ m.days.push(newDay(g, m.maps, m.templates[0].id)); });
    $('#dlg').innerHTML = ''; $('#dlg').onclick = null; IMP = null;
    addMeet(m, 'Created "' + m.name + '" with ' + stats.added + ' events').then(function(){ UI.view = 'schedule'; UI.schedDay = M.days[0].id; render(); });
    return;
  }
  groups.forEach(function(g){
    if (g.target === 'new'){ var nd = newDay(g, M.maps, M.templates[0].id); M.days.push(nd); return; }
    var d = day(g.target); firstDay = firstDay || d.id;
    if (!d.date && g.iso) d.date = g.iso;
    if (g.mode === 'replace'){
      d.events = g.events.map(function(e){ stats.added++; return ipNewEvent(e, g.tpl); }); d.status = {}; d.defaultTemplateId = g.tpl; return;
    }
    var hits = ipMatches(g);
    g.events.forEach(function(e, k){
      var h = hits[k];
      if (!h){ d.events.push(ipNewEvent(e, g.tpl)); stats.added++; return; }
      if (e.start != null) h.start = e.start;
      if (e.heats) h.heats = e.heats;
      if (e.athletes) h.athletes = e.athletes;
      if (e.round) h.round = e.round;
      if (!h.gender && e.gender) h.gender = e.gender;
      if (!h.startType && e.startType) h.startType = e.startType;
      if (!h.line && e.line) h.line = e.line;
      h.num = e.num; h.fullName = e.fullName; h.entries = e.entries; if (e.note) h.note = e.note;
      stats.updated++;
    });
    d.events.sort(function(a, b){ return (a.start == null ? 1e9 : a.start) - (b.start == null ? 1e9 : b.start); });
  });
  $('#dlg').innerHTML = ''; $('#dlg').onclick = null; IMP = null;
  if (!M.settings.activeDayId) M.settings.activeDayId = M.days[0].id;
  autoPickDay(); save(); UI.view = 'schedule'; UI.schedDay = firstDay; render();
  toast((stats.updated ? stats.updated + ' events updated' : '') + (stats.updated && stats.added ? ', ' : '') + (stats.added ? stats.added + ' added' : '') + (stats.days ? ' · ' + stats.days + ' new day' + (stats.days > 1 ? 's' : '') : ''));
}

function loadImageFile(file, cb){
  var fr = new FileReader();
  fr.onload = function(){ shrink(fr.result, cb); };
  fr.readAsDataURL(file);
}
function shrink(src, cb){
  var img = new Image();
  img.onload = function(){
    var max = 2000, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
    var cv = document.createElement('canvas'); cv.width = Math.round(w*s); cv.height = Math.round(h*s);
    var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', .86));
  };
  img.onerror = function(){ toast('That file could not be read as an image'); };
  img.src = src;
}

function nextLabel(l){ return /^[A-Y]$/.test(l) ? String.fromCharCode(l.charCodeAt(0)+1) : l; }
function pickImage(cb){ var fi = $('#fileImg'); fi.value = ''; fi.onchange = function(){ if (fi.files[0]) loadImageFile(fi.files[0], cb); }; fi.click(); }
function download(name, text){
  if (window.claude){
    claude.use('downloads').then(function(dl){
      if (!dl) return toast('Saving files isn\'t available here.');
      dl.save({ filename:name, data:text }).then(function(r){ if (r === 'saved') toast('Backup saved'); }).catch(function(e){ if (!e || e.code !== 'cancelled') toast('The backup wasn\'t saved.'); });
    });
    return;
  }
  downloadLocal(name, text);
}
function downloadLocal(name, text){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
var toastT = null;
function toast(msg){ var el = $('.toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent = msg; el.style.display = ''; clearTimeout(toastT); toastT = setTimeout(function(){ el.style.display = 'none'; }, 3200); }

/* Shift times dialog */
function openShift(){
  var d = day(UI.schedDay), evs = d.events.filter(function(e){ return e.start != null; }).slice().sort(function(a,b){ return a.start-b.start; });
  if (!evs.length) return toast('No timed events on this day');
  $('#dlg').innerHTML = '<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="shT"><h2 id="shT">Shift event times</h2><p class="muted" style="margin-top:0">For when the meet runs ahead or behind. Every call time moves with its event.</p>' +
    '<label class="lbl" for="shFrom">Starting with</label><select class="f" id="shFrom">' + evs.map(function(e){ return '<option value="' + e.id + '">' + fmt(e.start) + ' — ' + esc(evTitle(e)) + '</option>'; }).join('') + '</select>' +
    '<div class="row" style="margin-top:12px"><label class="lbl" for="shMin" style="margin:0">Move by</label><input class="f" type="number" id="shMin" value="10" style="width:90px"><span class="muted">minutes (use a negative number to move earlier)</span></div>' +
    '<label class="row" style="gap:6px;margin-top:10px"><input type="checkbox" id="shLater" checked> Also move every event after it</label>' +
    '<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="shCancel">Cancel</button><button class="btn primary" id="shGo">Shift times</button></div></div></div>';
  $('#shCancel').onclick = function(){ $('#dlg').innerHTML = ''; };
  $('#shGo').onclick = function(){
    var from = d.events.filter(function(e){ return e.id === $('#shFrom').value; })[0], by = +$('#shMin').value || 0, later = $('#shLater').checked;
    d.events.forEach(function(e){ if (e.start == null) return; if (e === from || (later && e.start > from.start) || (later && e.start === from.start)) e.start += by; });
    save(); $('#dlg').innerHTML = ''; renderSchedule(main); toast('Moved ' + (by > 0 ? '+' : '') + by + ' min');
  };
}

/* Workbook import */
$('#fileXlsx').addEventListener('change', function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var wb = XLSX.read(new Uint8Array(fr.result), { type:'array', bookFiles:true });
      var r = ClerkImporter.importWorkbook(XLSX, wb);
      if (!r.days.length) return toast('No competition-day tabs with events were found in that workbook');
      var asNew = UI.importAsNew || !M; UI.importAsNew = false;
      chooseImport(f.name.replace(/\.\w+$/, ''), r, asNew);
    }catch(err){ console.error(err); toast('Could not read that workbook: ' + err.message); }
  };
  fr.readAsArrayBuffer(f);
});
function chooseImport(name, r, asNew){

  $('#dlg').innerHTML = '<div class="ov"><div class="modal" role="dialog" aria-modal="true"><h2>Import "' + esc(name) + '"</h2>' +
    '<p>Found <b>' + r.days.length + ' days</b> (' + r.days.map(function(d){ return esc(d.name); }).join(', ') + '), <b>' + ev + ' events</b>, ' + r.templates.length + ' call schemes, ' + r.notes.length + ' notes sections and ' + r.maps.length + ' map image(s).</p>' +
    '<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="imCancel">Cancel</button>' + (asNew ? '' : '<button class="btn" id="imAdd">Add days to "' + esc(M.name) + '"</button>') + '<button class="btn primary" id="imNew">Create a new meet</button></div></div></div>';
  $('#imCancel').onclick = function(){ $('#dlg').innerHTML = ''; };
  function finish(replace){
    var mapsDone = 0, maps = [];
    function done(){

  var b = banners(); if (!live()){ main.innerHTML = b; return; }

  main.innerHTML = b + '<div class="tsum"><div><b class="num">' + S.shoes.length + '</b><span>shoe photos</span></div><div' + (fails ? ' class="hot"' : '') + '><b class="num">' + fails + '</b><span>marked fail</span></div><div><b class="num">' + Object.keys(S.shoes.reduce(function(m, x){ m[x.athKey] = 1; return m; }, {})).length + '</b><span>athletes checked</span></div></div>' +
    '<div class="ci-top" style="margin-top:12px"><div class="filters" role="group" aria-label="Filter" style="margin:0">' + [['all','All'],['fail','Fail'],['pass','Pass']].map(function(k){ return '<button data-ushoef="' + k[0] + '" aria-pressed="' + (f === k[0]) + '">' + k[1] + '</button>'; }).join('') + '</div><input class="f" type="search" id="shoeLQ" placeholder="Athlete, school, bib or label" value="' + esc(UI.shoeLQ || '') + '" style="flex:1 1 220px"></div>' +
    '<div id="shoeLogBody">' + (order.length ? '<div class="qlist">' + order.map(function(k){ var g = groups[k], a = g[0]; return '<div class="card shoecard"><div class="shoe-h"><b class="athn">' + esc(a.name) + '</b>' + (a.bib ? '<span class="shoe-bib num">#' + esc(a.bib) + '</span>' : '') + '</div><div class="shoe-team">' + esc(a.team || 'No school listed') + '</div>' + shoeThumbs(g) + '</div>'; }).join('') + '</div>' : '<div class="card empty">' + (S.shoes.length ? 'No shoe photos match.' : 'No shoe photos yet. They appear here as Shoe Check officials save them.') + '</div>') + '</div>';
}
function shoeNormU(x){ return String(x || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

  var t = e.target, b;
  if ((b = t.closest('[data-ushoeadd]'))){ var ath = (UI.shoeHits || {})[b.dataset.ushoeadd]; if (ath && canPhoto()) openShoeAdd(ath); return true; }
  if ((b = t.closest('[data-ushoeview]'))){ viewShoe(b.dataset.ushoeview); return true; }
  if ((b = t.closest('[data-ushoef]'))){ UI.shoeF = b.dataset.ushoef; render(); return true; }
  if (t.closest('[data-ushare]')){ Sync.shareDialog(M.id); return true; }
  if (t.closest('[data-urole]')){ roleDialog(false); return true; }
  if (t.closest('[data-dismiss-welcome]')){ UI.welcome = null; render(); return true; }
  if ((b = t.closest('[data-uflag]'))){ var p = b.dataset.uflag.split('|'); openReport(p[0], +p[1], p[2]); return true; }
  if ((b = t.closest('[data-uopen]'))){ openDetail(b.dataset.uopen); return true; }
  if ((b = t.closest('[data-uvm]'))){ lsSet('to.uview.' + UI.role, b.dataset.uvm); render(); return true; }
  if ((b = t.closest('[data-utog]'))){ UI.uOpen = UI.uOpen || {}; UI.uOpen[b.dataset.utog] = !UI.uOpen[b.dataset.utog]; var y = window.scrollY; render(); window.scrollTo(0, y); return true; }
  if (t.closest('[data-uheatok]')){ if (cw()) heatOk(); return true; }
  if ((b = t.closest('[data-unav]'))){ gotoHeat(+b.dataset.unav); return true; }
  if (t.closest('[data-uunclear]')){ var list = heatList(), h = list[heatIdx(list)]; db.doc(P('clears/' + safeId(h.e.id + '-s' + h.s.num + '-' + meId))).delete().catch(function(){ toast('Couldn\'t undo. Try again.'); }); return true; }
  if ((b = t.closest('[data-ufilter]'))){ S.filter = b.dataset.ufilter; render(); return true; }
  if ((b = t.closest('[data-utf]'))){ S.tfilter = b.dataset.utf; render(); return true; }
  if ((b = t.closest('[data-ufinal]'))){ markFinal(b.dataset.ufinal); return true; }
  if ((b = t.closest('[data-uunfinal]'))){ unFinal(b.dataset.uunfinal); return true; }
  if ((b = t.closest('[data-qrbig]'))){ showQrBig(b.dataset.qrbig); return true; }
  if ((b = t.closest('[data-qrcopy]'))){ copyJoin(b.dataset.qrcopy); return true; }
  if ((b = t.closest('[data-stm]'))){ UI.stMode = b.dataset.stm; render(); if (UI.stMode === 'find'){ var si = $('#stSearch'); if (si) si.focus(); } return true; }
  if ((b = t.closest('[data-stog]'))){ UI.stOpen = UI.stOpen || {}; UI.stOpen[b.dataset.stog] = !UI.stOpen[b.dataset.stog]; var y2 = window.scrollY; render(); window.scrollTo(0, y2); return true; }
  /* setup */
  if ((b = t.closest('[data-ufac]'))){ if (b.disabled) return true; collectOff(); S.offDraft.facility = b.dataset.ufac; S.offDirty = true; redrawOff(); return true; }
  if ((b = t.closest('[data-ustep]'))){ if (b.disabled) return true; collectOff(); S.offDraft.umpireCount = Math.max(1, Math.min(40, (S.offDraft.umpireCount || 1) + (+b.dataset.ustep))); S.offDirty = true; redrawOff(); return true; }
  if (t.id === 'saveOff'){ saveOff(); return true; }
  if ((b = t.closest('[data-ubook]'))){ collectDraft(); S.draftBook = b.dataset.ubook; var c = $('#rulesCard'); c.outerHTML = rulesCard(); saveRules('Rulebook set to ' + bookName(S.draftBook) + '. Calls now cite its rule numbers.'); return true; }

  if (t.id === 'saveRules'){ collectDraft(); saveRules('Saved ' + S.draft.length + ' ' + bookName(S.draftBook) + ' rule numbers.'); return true; }
  return false;
}
function change(e){
  var t = e.target;
  if (t.id === 'uJump'){ UI.uCursor = t.value; render(); window.scrollTo(0, 0); return true; }
  if (t.dataset && t.dataset.ufinui){ var u = S.finUI[t.dataset.ufinui] = S.finUI[t.dataset.ufinui] || {}; if (t.type === 'checkbox') u.ok = t.checked; else u.note = t.value; return true; }
  if (t.closest && t.closest('#offCard')){ S.offDirty = true; collectOff(); if (t.matches('#o-useasst,select[data-ulay],#o-count,#o-lap,select[data-uovr],textarea[data-uposlist]')) redrawOff(); else { var sv = $('#saveOff'); if (sv) sv.disabled = false; } return true; }
  if (t.closest && t.closest('#rulesEd')){ S.rulesDirty = true; collectDraft(); return true; }
  return false;
}
function input(e){

  if (t.id === 'uSearch'){ S.q = t.value; var y = window.scrollY; render(); var si = $('#uSearch'); if (si){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); } window.scrollTo(0, y); return true; }
  if (t.id === 'shoeLQ'){ UI.shoeLQ = t.value; var yq = window.scrollY; render(); var li = $('#shoeLQ'); if (li){ li.focus(); li.setSelectionRange(li.value.length, li.value.length); } window.scrollTo(0, yq); return true; }

}

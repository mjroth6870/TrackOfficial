<template id="helpSrc"><section id="h-start">
<h2>Getting started</h2>
<p>Track Official runs a track meet's officiating from one meet program: clerking calls and check-in, start-line staging, combined events, shoe check, umpire reports, chief umpire review, referee decisions and timing results. Every official uses the same app on their own phone, tablet or computer, and a shared meet keeps all of them in step live.</p>


<h3>The header</h3>
<ul>
<li><b>App name and version</b> (top left). The version number goes up with every update. If two devices show different numbers, the one with the lower number should reload the page.</li>
<li><b>Meet name</b> (center). Below it, the active day and whether the meet is <i>shared</i> (live across devices) or on <i>this device</i> only.</li>
<li><b>Day picker.</b> When the meet has more than one competition day, choose which day you're working.</li>
<li><b>Role chip.</b> Shows your role. Tap it to change role.</li>

<li><b>Sound and voice buttons.</b> Turn the call chime and spoken calls on or off on this device.</li>
<li><b>Clock</b> (top right). The meet runs on this clock.</li>
</ul>
<p>Below the header is a row of tabs. Which tabs you see depends on your role. <b>Help</b> is always the last tab.</p>
<h3>Choosing your role</h3>
<p>The first time you open the app it asks <i>What is your job at this meet?</i> The roles are grouped:</p>
<ul>
<li><b>Meet:</b> Meet Director, Timing, Shoe Check, Combined Events.</li>
<li><b>Clerking:</b> Head Clerk, Clerk, Line Clerk.</li>
<li><b>Umpiring:</b> Referee, Chief Umpire, Chief's Assistant (when used), Umpire, Lap Counter.</li>
</ul>
<p>Officials who open the app from an access code land on their role automatically. To switch later, tap the role chip in the header and pick another role. Your role only changes this device.</p>
<h3>Which tabs each role sees</h3>
<table class="htable">
<tr><th>Role</th><th>Tabs</th></tr>
<tr><td>Meet Director</td><td>Athlete Status, Schedule, All Calls, Lap Counting, Maps, Clerking Notes, Setup, Access, Meets</td></tr>
<tr><td>Head Clerk</td><td>Live Calls, Check-in, Start Line, Athlete Status, Schedule, Maps, Clerking Notes, Setup, Access, Meets</td></tr>
<tr><td>Clerk</td><td>Live Calls, Check-in, Athlete Status, Maps, Clerking Notes, Meets</td></tr>
<tr><td>Line Clerk</td><td>Start Line, Live Calls, Athlete Status, Maps, Meets</td></tr>
<tr><td>Umpire</td><td>Heats, My Calls, Athlete Status, Meets</td></tr>
<tr><td>Chief Umpire</td><td>Review, Heats, All Calls, Lap Counting, Shoe Checks, Athlete Status, Setup, Access, Meets</td></tr>
<tr><td>Chief's Assistant</td><td>Review, Heats, All Calls, Lap Counting, Shoe Checks, Athlete Status, Meets</td></tr>
<tr><td>Referee</td><td>Decisions, All Calls, Heats, Lap Counting, Shoe Checks, Athlete Status, Setup, Access, Meets</td></tr>
<tr><td>Timing</td><td>Results, All Calls, Lap Counting, Athlete Status, Meets</td></tr>
<tr><td>Lap Counter</td><td>Lap Counting, Meets</td></tr>
<tr><td>Shoe Check</td><td>Shoe Check, Meets</td></tr>
<tr><td>Combined Events</td><td>Combined Events, Athlete Status, Meets</td></tr>
</table>
<p class="hint">When a meet turns clerking off, Live Calls, Check-in and Clerking Notes are hidden, and only the Line Clerk keeps the Start Line.</p>


</section>
<section id="h-meets">
<h2>Meets</h2>
<p>The <b>Meets</b> tab lists the meets on this device and is where you create, open, share, back up and archive them.</p>
<h3>Creating a meet</h3>
<ol>
<li>Tap <b>Create a new meet</b>, enter its name, and save. Or use <b>New from meet program</b> to create the meet and import its schedule in one step (see <a href="#h-import">Importing a meet program</a>).</li>
<li>Go to <b>Setup</b> to add competition days, dates and officials.</li>
<li>Tap <b>Share live</b> so officials can open the meet on their own devices.</li>
</ol>
<h3>Actions on each meet</h3>
<ul>
<li><b>Open</b>: make it the active meet on this device.</li>
<li><b>Share live</b> / <b>Stop sharing</b>: turn live syncing across devices on or off.<span> Officials can only use access codes for a shared meet.</span></li>
<li><b>Export</b>: save a backup file (.json) of the meet. <b>Import backup</b> brings one back, including onto another device or into the hosted copy of the app.</li>
<li><b>Archive</b> / <b>Restore</b>: archived meets move to the bottom of the list and become read-only.</li>
<li><b>Delete</b>: removes the meet from this device for good. Export it first if you might need it.</li>
</ul>
<p><b>Your shared meets not on this device</b> lists shared meets your account owns that aren't on this device yet. Tap <b>Open on this device</b> to bring one down.</p>
<div class="tip"><b>Your account card</b> at the top of Meets shows who you're signed in as, with <b>Edit name</b>, <b>Contact Support</b>, <b>Sign out</b> (hosted site) and, for admins, <b>Admin</b>. A message from an admin also appears here until you dismiss it.</div>
<h3>Contact Support</h3>
<p>Tap <b>Contact Support</b>, choose a topic and describe the problem. <b>Open email</b> opens your email app with a message to trackofficialapp@gmail.com, with your account email and device details already added so support can reply. If no email app opens, tap <b>Copy message instead</b> and paste it into any email.</p>
</section>
<section id="h-practice">
<h2>Practice meets</h2>
<p>Every account gets two practice meets on its Meets tab: <b>Practice Meet – Indoor 200m</b> and <b>Practice Meet – Outdoor 400m</b>. Use them to try every role without building a meet.</p>
<ul>
<li>Each has two days of standard running events and relays for women and men, with two heats of each filled with athletes, and relay teams' legs entered. Field events come only in the combined events (one for each gender), which the combined events coordinators run, since clerking doesn't handle field events.</li>
<li>Every official is filled in with a test name: head clerks, clerks, line clerks, shoe check, referee, chief umpire, timing, six umpires with posts, and four lap counters already assigned to the distance races. The rulebook is set to USATF.</li>
<li>Officials that are off by default are named too. Turning on <b>Use a Chief's Assistant</b> (chief umpire Setup) or <b>Combined Events Coordinators</b> (Setup → Meet) brings in their test official straight away.</li>
<li>Every test official has an access code on the Access tab, so you can open the meet on a second phone as that official.</li>
</ul>
<h3>Restart practice</h3>
<p><b>Restart practice</b> on the Meets tab starts a practice meet over: day 1 becomes today with the first event 30 minutes from now, and every check-in, call, umpire report, decision, shoe check and lap count is cleared. The events, athletes and test officials stay.</p>
<h3>Archiving and deleting</h3>
<p>You can archive a practice meet and restore it later. Only an admin can delete one, from Admin → the account → its meets. An admin can also use <b>Recreate practice meets</b> on the account's Support card to give it a fresh pair.</p>
</section>
<section id="h-setup">
<h2>Setting up a meet</h2>
<p>Setup is on the Meet Director, Head Clerk, Referee and Chief Umpire tabs, and each role sees only its own sections, in full-width rows:</p>
<ul>
<li><b>Meet Director:</b> Meet, Data, Rulebook, plus line clerks and shoe check when clerking is off.</li>
<li><b>Head Clerk:</b> Meet, Data, Alerts, Call schemes, Officials.</li>
<li><b>Referee:</b> Meet, Data, Rulebook.</li>
<li><b>Chief Umpire:</b> Rulebook, then Umpiring officials &amp; posts.</li>
</ul>

<h3>Meet</h3>
<ul>
<li><b>Name</b> of the meet.</li>
<li><b>Competition days:</b> add a day for each day of competition, give it a name and date, and reorder or delete days. The date keeps countdowns and the status board lined up.</li>
<li><b>Use clerking in this meet:</b> turn this off when the meet uses another clerking method. See <a href="#h-noclerk">When clerking is turned off</a>.</li>
<li><b>Combined Events Coordinators:</b> turn on up to two coordinators and set each to Men, Women or Both. See <a href="#h-ce">Combined events</a>.</li>
<li><b>Reset call status for active day</b>: clears every call mark on the day so calls can run again (for a rehearsal, say).</li>
</ul>
<p><b>Shoe photos:</b> set how many days shoe check photos are kept before they're deleted automatically.</p>
<h3>Data</h3>
<ul>
<li><b>Import meet program…</b>: add or replace events from the meet program file (see the next section).</li>
<li><b>Backup</b>: export the whole meet to a file, or import a backup.</li>
</ul>
<h3>Alerts</h3>
<p>How calls get your attention: the pop-up when a call is due, the chime, spoken calls, and <b>Allow system notifications</b> so calls show even when the app is in the background. <b>Show a test pop-up</b> checks it all on this device. <b>Test clock</b> lets you run the meet at a different time to rehearse; turn it off before competition.</p>
<h3>Call schemes</h3>
<p>A call scheme is the set of calls for an event and how many minutes before its start each one goes out. Two come built in:</p>
<ul>
<li><b>60 / 45 / 15 / 5 min:</b> 1st Call, 2nd Call, Report Time, Leave Clerking.</li>
<li><b>30 / 20 / 15 / 5 min:</b> First Call, Second Call, Report Time, Leave Clerking.</li>
</ul>
<p>Add your own with <b>New scheme</b>, rename calls, change the minutes, and choose which scheme each event uses.</p>
<h3>Officials</h3>
<p>Name the head clerks, clerks, line clerks and shoe check officials. <span>Each named official gets their own access code on the <b>Access</b> tab, and </span><span>c</span>lerks can be assigned to events on the Schedule.</p>
</section>
<section id="h-ump-setup">
<h2>Umpiring setup</h2>
<h3>Rulebook</h3>
<p>The referee (or meet director) chooses <b>WA</b>, <b>USATF</b> or <b>NFHS</b>. Every report then cites the rule number for the infraction. Rule numbers can be adjusted and saved with <b>Save rule numbers</b>.</p>
<h3>Umpiring officials &amp; posts</h3>
<p>The chief umpire names the referee, the chief umpire, the chief's assistant (optional), and each numbered umpire, then assigns each umpire a <b>post</b> for every track layout used (sprints, hurdles, distance, relays and so on). <b>Save umpiring officials</b> stores it. Each umpire's reports then fill in where they stood automatically. Umpires can also choose their number on their own device with <b>Set my number</b>.</p>
<h3>Relay exchange zones</h3>
<p>The relay layout includes the exchange zones used on each track size:</p>
<ul>
<li><b>Indoor 200m:</b> one exchange zone.</li>
<li><b>Outdoor 400m:</b> up to three zones (back straight, 200m mark, home straight), depending on the relay.</li>
</ul>
<p>Each common relay for the track size lists which zones it uses, so posts can be assigned to the exchanges that matter for that race.</p>
</section>
<section id="h-import">
<h2>Importing a meet program</h2>
<ol>
<li>Choose <b>Import meet program…</b> in Setup → Data (or <b>New from meet program</b> on Meets).</li>
<li>Paste the meet program text, or choose the file, and preview it. The preview lists each day's events with their heats or flights and athletes.</li>
<li>Choose whether to <b>add</b> the events to the day or <b>replace all events on that day</b>, then import.</li>
</ol>
<div class="tip warn"><b>Replacing a day</b> clears its check-ins and start-line staging. The app lists exactly what will be cleared and asks you to confirm with <b>Replace and clear</b>. Athletes who already competed in a contested heat aren't affected by a reseed.</div>
<p>Field events use <b>flights</b>; running events use <b>heats</b>. Give prelims and finals of the same event different event numbers in the program file, or their heats will be merged into one event.</p>
</section>
<section id="h-access">
<h2>Access codes</h2>
<p>The <b>Access</b> tab gives every official a QR code and link that opens the meet on their device in their role. The meet must be shared live first.</p>
<ul>
<li>The top row has the Meet Director and Timing. Next come the <b>Lead officials</b>: Referee, Chief Umpire, and the Chief's Assistant when used. Below are clerking officials, umpires, shoe check and combined events coordinators.</li>
<li>Tap <b>Show large</b> to display a code full-screen for scanning, or <b>Copy link</b> to send it by text or email.</li>
<li>An official who scans a code is signed in to that meet only. They can't see or change your other meets.</li>
</ul>
</section>
<section id="h-schedule">
<h2>Schedule</h2>
<p>The Schedule lists the active day's events in start-time order, with their heats or flights, athletes, call scheme and assigned clerk.</p>
<ul>
<li><b>Edit an event:</b> tap it to change its name, start time, call scheme, assigned clerk or line clerk, or delete it.</li>
<li><b>Add an event</b> for anything not in the meet program.</li>
<li><b>Shift times…</b>: move every event after a point earlier or later when the meet runs ahead or behind. Calls and countdowns follow.</li>
<li><b>Sort by start time</b> after manual changes.</li>
</ul>

<h3>Entering athletes (finals, semis and manual events)</h3>
<p>Events with no athletes yet still appear on the Schedule. Open one and tap <b>Enter athletes</b>:</p>
<ol>
<li>Add a heat or flight, then use <b>Find an athlete</b> to pick athletes already in the meet program (by name, bib or team) and set their lanes or order.</li>
<li><b>Remove heat</b> / <b>Remove flight</b> deletes one you don't need.</li>
<li><b>Save</b>. Clerks, the line clerk and umpires see the athletes straight away.</li>
</ol>
<h3>Relay legs</h3>
<p>For a relay team, enter the runners for each leg in running order. Umpires see the legs in order and pick the runner by leg when they report a foul on that team.</p>
</section>
<section id="h-live">
<h2>Live Calls</h2>
<div class="tip"><b>Clerking handles running events only.</b> Field event athletes check in with the officials at their event, so field events get no calls, don't appear in Check-in or on the Start Line, and show as <i>At the event</i> on the status board.<span> A combined events coordinator checks in every event they run, field events included.</span></div>
<p>Live Calls shows every call due on the active day, in order, with a countdown to each. When a call is due, a pop-up appears with the chime and, if voice is on, the call is read aloud.</p>
<ul>
<li><b>By call time</b> or <b>By event</b> changes how the list is grouped. <b>Jump to now</b> scrolls to the current calls.</li>
<li>Tap a call to mark it made. <b>Undo</b> reverses it.</li>
<li><b>Snooze 1 min</b> delays a pop-up. <b>Skip</b> marks a call as not needed.</li>
<li>Clerks assigned to events see only those events; a head clerk sees all events.</li>
</ul>
<h3>Pause, resume and end the day</h3>
<p><b>Pause the meet</b> holds every countdown (for weather, say), and <b>Resume the meet</b> shifts the remaining times by the length of the pause. <b>End</b> the day when competition is done; <b>Reopen day</b> brings it back.</p>
</section>
<section id="h-checkin">
<h2>Check-in</h2>
<p>Check-in lists each running event's athletes by heat. Tap an athlete to check them in. Other options:</p>
<ul>
<li><b>Scratch</b>: the athlete won't compete.</li>
<li><b>DNS</b>: did not start.</li>
<li><b>Late check-in</b>: checked in after Report Time. The time and the clerk are recorded.</li>
</ul>
<p>Search by name, bib or team, or switch between <b>By event</b> and <b>All events</b>. Counts at the top show checked in, scratched and still to come. Every change shows on the Start Line, the status board and umpire heat sheets.</p>
</section>
<section id="h-startline">
<h2>Start Line</h2>
<p>The line clerk stages each heat at the start. The next one is shown with each athlete's lane and check-in status.</p>
<ul>
<li><b>Stage this heat</b> (or flight) when the athletes are at the line. <b>Next heat ›</b> moves on.</li>
<li><b>Skip this heat…</b> if it isn't running. You can mark the athletes as skipped.</li>
<li>Mark <b>Scratch</b> or <b>DNS</b> for athletes who don't come to the line. Umpires and timing see it on their sheets.</li>
</ul>
<p>When clerking is turned off, the Start Line is still available to line clerks for marking Scratch and DNS.</p>
</section>
<section id="h-notes">
<h2>Clerking notes and maps</h2>
<p><b>Clerking Notes</b> is a shared notepad for the clerking team: add sections for procedures, problems or reminders. The <b>Day log</b> records what happened on the day.</p>
<p><b>Maps</b> holds facility maps (where clerking, the call room and each start are). Add a map image, rename it, replace the image or delete it. Everyone on the meet can view them.</p>
</section>
<section id="h-status">
<h2>Athlete Status</h2>
<p>The status board follows every athlete from check-in to result: checked in, scratched or DNS, staged at the line, competed, any umpire call and its decision, and shoe check. Open field events show <i>At the event</i>, because their officials check athletes in there. Search by name, bib or team, or filter by event. The Meet Director and every umpiring role can see it.</p>
</section>
<section id="h-ce">
<h2>Combined events</h2>
<p>When combined events coordinators are turned on, every combined event in the meet program (heptathlon, decathlon, pentathlon and so on, including their field events) is run by the coordinators instead of clerking. Each coordinator is set to Men, Women or Both and sees those events.</p>
<ul>
<li>Events are listed in order of competition with their heats or flights from the meet program.</li>
<li><b>Check in</b> and <b>Scratch</b> athletes just like clerks do.</li>
<li>Change an event's start time when needed. The new time shows on umpire sheets.</li>
<li><b>Start now</b> and <b>Finish now</b> record the actual start and finish times. <b>Clear times</b> resets them.</li>
<li>Once the next event's start time is set, it shows a live countdown.</li>
</ul>
</section>
<section id="h-shoe">
<h2>Shoe check</h2>
<ol>
<li>Find the athlete by name, bib or team.</li>
<li>Take or choose a photo of the shoe.</li>
<li>For each of the athlete's events, mark the shoe <b>Pass</b>, <b>Fail</b> or <b>N/A</b>. An athlete with several events can pass for some and fail for others.</li>
<li><b>Save photo</b>.</li>
</ol>
<p>Shot put, discus, hammer, weight throw and super weight throw don't need checking and are left out.</p>
<p><b>WA shoe checker:</b> the World Athletics certification checker opens beside Shoe Check (the right half on tablets and computers; a toggle on phones) so you can look a shoe up while you record it. If it doesn't load inside the app, use its <b>Open in new tab</b> button.</p>
<p>Photos are deleted automatically after the retention period set in Setup. <b>Remove this photo</b> deletes one sooner.</p>
<p>The chief umpire, assistant and referee see every check on the <b>Shoe Checks</b> tab.</p>
</section>
<section id="h-umpire">
<h2>Umpire</h2>
<ol>
<li>On <span><b>Heats</b></span>, choose the event and heat. The lanes show each athlete with bib and team, check-in status and any L already on record.</li>
<li>To report an infraction, tap <b>Report</b> (the flag) on the athlete's lane.</li>
<li>Choose the <b>rule</b> (for example lane infringement on the bend, obstruction, false start), where it happened, and add notes. For a relay, pick the runner by leg.</li>
<li>For one-step lane infringements under WA or USATF, say whether it was <b>1 step — L</b> or <b>2 or more steps — DQ</b> (see <a href="#h-lrule">The one-step L rule</a>).</li>
<li>Submit. The call goes to the chief umpire right away.</li>
<li>When the heat is done, tap <b>Done – next heat ›</b>. If you saw nothing, that logs an "umpire OK" for the heat.</li>
</ol>
<p><b>My Calls</b> shows your reports and what happened to each. <b>Withdraw my call</b> takes one back before it's decided.</p>
</section>
<section id="h-chief">
<h2>Chief umpire and assistant</h2>
<p>The <b>Review</b> tab lists calls awaiting review. Open a call to see the umpire, post, rule, location, notes and history, then:</p>
<ul>
<li><b>Send to referee</b> for a decision.</li>
<li><b>No further action</b> to close it.</li>
<li><b>Record L – no DQ</b> when it's a first one-step lane infringement.</li>
</ul>
<p>The chief's assistant shares the same review queue, so two people can work through calls at busy times.</p>
</section>
<section id="h-referee">
<h2>Referee</h2>
<p>The <b>Decisions</b> tab has <i>Needs a decision</i> and <i>Open protests</i>.</p>
<ul>
<li>Open a call and choose <b>Disqualify</b> or <b>No disqualification</b>. For one-step calls the buttons read <b>Record L – no DQ</b> or <b>Disqualify (2+ steps)</b>.</li>
<li><b>Place under protest</b> records a protest against a decision. <b>Rule on the protest</b> to uphold it (the decision changes) or <b>Deny – decision stands</b>.</li>
</ul>
</section>
<section id="h-timing">
<h2>Timing</h2>
<p>The <b>Results</b> tab shows each event with its decisions: disqualifications, no-DQ outcomes, protests, umpire OKs, scratches and DNS from the start line, and <b>Lane marks</b> (any L in the event, including one carried in from an earlier round).</p>
<ul>
<li><b>Mark event final</b> once every decision is in. If something changes afterwards, the event is flagged and can be <b>Re-finalize</b>d.</li>
<li><b>Reopen event</b> takes it out of final.</li>
</ul>
</section>
<section id="h-calls">
<h2>All Calls</h2>
<p>Every call in the meet with its status: reported, with the referee, closed, withdrawn, DQ or no DQ. Filter by event or status and open any call to see its full history.</p>
</section>
<section id="h-lrule">
<h2>The one-step L rule</h2>
<p>Under WA rules 17.3.3 and 17.3.4 and USATF rule 163.5 (break lines excluded), a single step on or over the lane line or curb is marked <b>L</b>. The L follows the athlete into later rounds of the same event. Two or more steps in one round, or across all rounds combined, is a disqualification.</p>
<ul>
<li>The <b>1 step / 2 or more steps</b> choice appears only when the rulebook is WA or USATF and the rule is a lane infringement on the bend, on the straight, or the curb.</li>
<li>The athlete is matched by bib (or name and team), and relays by team. Rounds of the same event are matched by event name and gender, even with different event numbers.</li>
<li>An L shows as a badge next to the athlete on umpire lane sheets, on call cards ("L · 1 step", or "2nd step → DQ"), in the call's history with links to every instance, and on timing's Lane marks.</li>
<li>When an umpire reports a step for an athlete who already has an L, a banner warns them first.</li>
<li>Calls closed with <b>No further action</b>, withdrawn calls, and DQs reversed on protest don't count toward the total.</li>
</ul>
</section>
<section id="h-laps">
<h2>Lap counting</h2>
<p>Lap counters count the laps of individual athletes in races of 1500m and longer. Each counter works on their own phone, starts their own clock on the gun, and taps an athlete's next box every time that athlete crosses the finish line.</p>
<h3>Setting up (<span>meet director, </span>referee or chief umpire)</h3>
<ol>
<li>Open <b>Lap Counting</b>. Set the <b>track</b> size once for the meet: 200m, 300m, 400m or another lap distance.</li>
<li>Under <b>Lap counters</b>, tap <b>+ Add a lap counter</b> for each person available and enter their name. Each one gets an access code on the <b>Access</b> tab.</li>
<li>Every race of 1500m and longer on the day is listed automatically (1500, 1600, mile, 3000, 3200, 2 mile, 5000, 10,000, steeplechase), with one card per heat. Shorter races can be added with <b>Count another race</b>, and any race can be turned off with <b>Count laps in this race</b>.</li>
<li>For each race, set how many counters it needs and tap <b>Auto-assign athletes</b> to share the field across them, keeping lanes together. Or use <b>+ Add a counter to this race</b> and tick each counter's athletes yourself. Pick who each counter is from the list. Two to five athletes per counter is usual.</li>
<li>Check the warnings: athletes no counter is counting, an athlete given to two counters, or a counter with more than five athletes.</li>
</ol>
<h3>Number of crossings</h3>
<p>The app works out how many times each athlete crosses the finish line from the race distance and the track size. On a 400m track: 1500m and mile 4, 3000m and 3200m 8, 5000m 13, 10,000m 25. On a 200m track: 1500m and mile 8, 3000m 15, 5000m 25. A start just behind the line, such as the mile's extra 9m, doesn't count as a lap. Change <b>Crossings</b> on a race card for a steeplechase or an unusual start; <b>Use … (automatic)</b> puts it back.</p>
<h3>Counting (lap counter)</h3>
<ol>
<li>Open the app from your access code (or choose <b>Lap Counter</b> and your name). <b>Lap Counting</b> lists your races for the day. Open the race before it starts.</li>
<li>Each of your athletes has a column: bib or lane, name and team at the top, and below it a box for every crossing, counting down the laps to go, then <b>1 · Bell</b>, then <b>Finish</b>.</li>
<li>Tap <b>Start</b> on the gun. Your clock starts.</li>
<li>Each time an athlete crosses the finish line, tap the highlighted box in their column. It records the time in the race and that lap's time, and the next box lights up. Only the next box responds, so a stray tap can't skip a lap. The phone vibrates briefly with each tap.</li>
<li>Tapped the wrong athlete? Tap <b>Undo</b> at the top of their column. <b>DNF</b> stops counting an athlete who drops out.</li>
<li>Tap <b>Stop</b> when all of your athletes have finished. If some haven't, the app asks first. <b>Resume counting</b> reopens it if you stopped too soon.</li>
</ol>
<div class="tip">Your taps are saved on your phone as you go and sent to the meet as soon as there's a connection, so a dropped signal doesn't lose a lap. The note at the top right says <i>Saved</i>, <i>Saving…</i> or <i>Offline – saved on this device</i>. The screen stays awake while you count.</div>
<h3>Lap charts (referee, chief umpire, timing)</h3>
<p>On a counted race, <b>Lap chart</b> shows every athlete's time at each crossing and each lap's time, with who counted them. It flags an athlete stopped short of the full number of crossings, an athlete marked DNF, and any lap much faster than that athlete's others (a possible missed lap) or much slower (a possible extra tap). <b>Export CSV</b> saves the chart as a spreadsheet file. Times are measured from each counter's own Start.</p>
</section>
<section id="h-noclerk">
<h2>When clerking is turned off</h2>
<p>Turn off <b>Use clerking in this meet</b> (Setup → Meet) when another clerking method is used. Then:</p>
<ul>
<li>Clerk roles and the Live Calls, Check-in and Clerking Notes tabs are hidden.</li>
<li>Line clerks keep the Start Line to mark Scratch and DNS for umpires and timing.</li>
<li>Shoe check stays available.</li>
<li>The meet director still adds athletes to finals and relay legs from the Schedule.</li>
</ul>
</section>
<section id="h-accounts">
<h2>Accounts and signing in (hosted site)</h2>
<ul>
<li>Meet staff create an account with email and password, or sign in with an email link. <b>The first account ever created becomes the admin.</b></li>
<li>Officials who scan an access code are signed in as a guest for that meet. They don't need an account.</li>
<li>A suspended account can still sign in and look, but can't change anything until an admin lifts the suspension.</li>
<li>New meets belong to the account that created them and appear on any device you sign in on.</li>
</ul>
</section>
<section id="h-admin">
<h2>Admin</h2>
<p>Admins see an <b>Admin</b> button on their account card. The Admin screen lists every account (search, Export CSV). For each account you can:</p>
<ul>
<li><b>View meets</b>: the meets it owns. <b>Archive</b> or <b>Restore</b> them, or <b>Change owner</b>.</li>
<li><b>Suspend</b> / <b>Lift suspension</b>, and <b>Make admin</b> / <b>Remove admin</b>.</li>
<li>Read its <b>Access log</b>: suspensions, admin changes, support sessions, messages, owner changes, app errors and refused changes.</li>
</ul>
<h3>Helping an account</h3>
<p>The account's <b>Support</b> card shows its email and sign-in method, meets, when it was last seen, the device and app version it last used, and any app errors. Tools:</p>
<ul>
<li><b>Open in support mode</b>: opens their meet on your device with every role and tab, so you can see what they see and fix setup. An orange bar shows whose meet you're in. <b>Setup check</b> lists what's missing; <b>End session</b> removes their meet from your device and reopens yours. Viewing another account also ends the session.</li>
<li><b>Send password reset email</b> (hosted site).</li>
<li><b>Send a message</b>: appears on their Meets tab until they dismiss it.</li>
<li><b>Assign a meet to this account</b>.</li>
<li><b>Recreate practice meets</b>: adds a fresh pair of practice meets the next time they open the app. Practice meets also get a <b>Delete</b> button in the account's meet list.</li>
</ul>
</section>
<section id="h-sync">
<h2>Live sharing and working offline</h2>
<ul>
<li>A shared meet syncs live: check-ins, staging, calls, decisions and schedule changes appear on every device within seconds.</li>
<li>Every device keeps a full copy. If the connection drops, keep working; changes queue and go out when it returns.</li>
<li>A meet that isn't shared stays on one device only.</li>
<li>After an update, reload the page (or close and reopen the home-screen app) so the version number matches everyone else's.</li>
</ul>
</section>
<section id="h-trouble">
<h2>Troubleshooting</h2>
<dl>
<dt>An official's access code doesn't open the meet.</dt><dd>Make sure the meet is shared live (Meets → Share live), then send the code again from Access.</dd>
<dt>Changes aren't showing on other devices.</dt><dd>Check the header says <i>shared</i>. Check the device is online. Compare version numbers and reload any device that's behind.</dd>
<dt>Calls aren't popping up or making sound.</dt><dd>Turn on the sound and voice buttons in the header, then use Setup → Alerts → <b>Show a test pop-up</b>. Phones may mute sound in silent mode. Check that the Test clock is off.</dd>
<dt>Events show at the wrong time.</dt><dd>Check the day's date in Setup → Meet, and use Schedule → <b>Shift times…</b> if the meet is running ahead or behind.</dd>
<dt>An event has no athletes.</dt><dd>That's normal for finals and semis. Use <b>Enter athletes</b> on the Schedule.</dd>
<dt>Reports don't show rule numbers.</dt><dd>The referee hasn't chosen a rulebook yet (Setup → Rulebook).</dd>
<dt>Still stuck?</dt><dd>Tap <b>Contact Support</b> on the Meets tab.</dd>
</dl>

<script>/* Workbook importer — shared by the app (in-browser) and the build script (Node).
   Turns a clerking workbook (one tab per competition day) into the app's meet model. */
var ClerkImporter = (function () {
  var SKIP = /^(instructions|map|maps|clerking notes|notes|uniforms?)$/i;
  var CALL_HDR = /^\s*(.*?)\s*-\s*(\d+)\s*$/;

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function normGender(g) {
    g = String(g == null ? '' : g).trim().toLowerCase();
    if (!g) return '';
    if (/^(m|male|men|man|boys?)$/.test(g)) return 'Men';
    if (/^(w|f|female|women|woman|girls?)$/.test(g)) return 'Women';
    if (/^(c|x|combined|mixed|coed)$/.test(g)) return 'Mixed';
    return g.charAt(0).toUpperCase() + g.slice(1);
  }

  function cellText(ws, r, c, XLSX) {
    var cell = ws[XLSX.utils.encode_cell({ r: r, c: c })];
    if (!cell || cell.v == null || cell.v === '') return '';
    if (cell.t === 'n' && cell.w && /[\/\-:]/.test(cell.w)) return String(cell.w).trim();
    return String(cell.v).trim();
  }

  function cellTimeMin(ws, r, c, XLSX) {
    var cell = ws[XLSX.utils.encode_cell({ r: r, c: c })];
    if (!cell || cell.v == null || cell.v === '') return null;
    if (cell.t === 'n') { var f = cell.v % 1; return Math.round(f * 1440); }
    if (cell.t === 'd') { var d = cell.v; return d.getHours() * 60 + d.getMinutes(); }
    return parseTime(String(cell.v));
  }

  function parseTime(s) {
    var m = String(s).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/i);
    if (!m) return null;
    var h = +m[1], mi = +(m[2] || 0), ap = (m[3] || '').toLowerCase();
    if (ap.startsWith('p') && h < 12) h += 12;
    if (ap.startsWith('a') && h === 12) h = 0;
    return h * 60 + mi;
  }

  function parseHeats(s) {
    s = String(s || '').trim();
    var m = s.match(/^(\d+)?\s*(T|SF|F|Q|P)?$/i);
    if (m && (m[1] || m[2])) return { heats: m[1] || '', round: (m[2] || '').toUpperCase(), athletes: '' };
    // "1-18" = 1 heat, 18 athletes (Excel may have stored it as a date, read back as "1-18" or "1/18")
    var h = s.match(/^(\d+)\s*[-\/]\s*(\d+)$/);
    if (h) return { heats: h[1], round: '', athletes: h[2] };
    return { heats: s, round: '', athletes: '' };
  }

  function sig(calls) { return calls.map(function (c) { return c.label + ':' + c.min; }).join('|'); }

  function importWorkbook(XLSX, wb, opts) {
    opts = opts || {};
    var templates = [], days = [], notes = [], maps = [];
    function templateFor(calls) {
      var s = sig(calls);
      for (var i = 0; i < templates.length; i++) if (sig(templates[i].calls) === s) return templates[i];
      var nm = calls.map(function (c) { return c.min; }).join(' / ') + ' min';
      if (templates.some(function (x) { return x.name === nm; })) nm += ' (' + calls.map(function (c) { return c.label; }).join(', ') + ')';
      var t = { id: 't' + uid(), name: nm, calls: calls };
      templates.push(t);
      return t;
    }

    wb.SheetNames.forEach(function (name) {
      var ws = wb.Sheets[name];
      if (!ws || !ws['!ref']) return;
      var range = XLSX.utils.decode_range(ws['!ref']);
      if (/notes/i.test(name)) { notes = notes.concat(readNotes(XLSX, ws, range)); return; }
      if (SKIP.test(name.trim())) return;

      var cur = null, events = [], seen = {}, used = {};
      for (var r = range.s.r; r <= range.e.r; r++) {
        var hdrCalls = [], isHdr = false;
        for (var c = 6; c <= 9; c++) {
          var h = cellText(ws, r, c, XLSX), m = h.match(CALL_HDR);
          if (m && isNaN(+h)) { isHdr = true; hdrCalls.push({ label: m[1].trim(), min: +m[2] }); }
        }
        if (isHdr) { cur = templateFor(hdrCalls); continue; }
        var ev = cellText(ws, r, 0, XLSX);
        if (!ev || /^event$/i.test(ev)) continue;
        var start = cellTimeMin(ws, r, 10, XLSX);
        var hp = parseHeats(cellText(ws, r, 5, XLSX));
        var e = {
          id: 'e' + uid(),
          name: ev,
          gender: normGender(cellText(ws, r, 1, XLSX)),
          startType: cellText(ws, r, 2, XLSX),
          line: cellText(ws, r, 3, XLSX).toUpperCase(),
          clerk: cellText(ws, r, 4, XLSX),
          heats: hp.heats,
          athletes: hp.athletes,
          lineClerk: '',
          round: hp.round,
          start: start,
          templateId: cur ? cur.id : null
        };
        var key = [e.name, e.gender, e.start, e.line].join('~');
        if (seen[key]) continue; // workbook tabs sometimes contain a pasted duplicate block
        seen[key] = 1;
        if (cur) used[cur.id] = (used[cur.id] || 0) + 1;
        events.push(e);
      }
      if (!events.length) return;
      var def = null, best = 0;
      for (var k in used) if (used[k] > best) { best = used[k]; def = k; }
      days.push({ id: 'd' + uid(), name: name.trim(), date: '', defaultTemplateId: def, mapId: null, events: events, status: {} });
    });

    if (wb.files) {
      Object.keys(wb.files).forEach(function (p) {
        var m = p.match(/^xl\/media\/(.+)\.(png|jpe?g|gif)$/i);
        if (!m) return;
        var f = wb.files[p], bytes = f.content || f._data || f.asUint8Array && f.asUint8Array();
        if (!bytes) return;
        maps.push({ id: 'm' + uid(), name: m[1], mime: 'image/' + m[2].toLowerCase().replace('jpg', 'jpeg'), bytes: bytes, markers: {} });
      });
    }
    return { templates: templates, days: days, notes: notes, maps: maps };
  }

  function readNotes(XLSX, ws, range) {
    var out = [], sec = null;
    for (var r = range.s.r; r <= range.e.r; r++) {
      var a = cellText(ws, r, 0, XLSX), b = cellText(ws, r, 1, XLSX);
      if (a) { sec = { id: 'n' + uid(), title: a.replace(/:\s*$/, ''), body: '' }; out.push(sec); }
      if (b) { if (!sec) { sec = { id: 'n' + uid(), title: 'Notes', body: '' }; out.push(sec); } sec.body += (sec.body ? '\n' : '') + b; }
    }
    return out;
  }

  return { importWorkbook: importWorkbook, normGender: normGender, parseTime: parseTime, parseHeats: parseHeats };
})();
if (typeof module !== 'undefined') module.exports = ClerkImporter;
</script>
<script>/* Meet-program parsers — taken unchanged from the Track Umpire Calls app (HY-TEK Meet Program, AthleticNET, DirectAthletics MeetPro). */
var MeetParse = (function(){

<script>/* Maps a parsed meet program (MeetParse output) onto the clerking model:
   one group per competition day, each holding clerking events with heats, athletes, round, start time and start lists. */
var ProgramMap = (function () {
  var WD = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  var WD_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function gender(name) {

    return out;
  }

  function entries(ev) {
    return (ev.sections || []).map(function (s) {
      return { num: s.num, of: s.of || null, kind: s.kind || 'Section', label: s.label || '',
        lanes: (s.lanes || []).map(function (l) { return { lane: l.lane, bib: l.bib || '', name: l.name || '', team: l.team || '', seed: l.seed || '', members: l.members || undefined }; }) };
    });
  }

  /* known: { [raceKey]: {startType, line} } learned from the open meet, so lines carry over */
  function map(parsed, known) {
    known = known || {};
    var meetDay = parseDay(parsed.meet && parsed.meet.date);
    var yearHint = meetDay.iso ? +meetDay.iso.slice(0, 4) : null;
    var groups = {}, order = [];
    (parsed.events || []).forEach(function (ev) {
      var d = parseDay(ev.time, yearHint);
      var key = d.iso || (d.md ? 'md:' + d.md : d.wd >= 0 ? 'wd:' + d.wd : 'none');
      if (!groups[key]) { groups[key] = { key: key, iso: d.iso, wd: d.wd, md: d.md || '', events: [] }; order.push(key); }

      groups[key].events.push({
        num: ev.num, name: sn, fullName: ev.name, gender: gender(ev.name),
        startType: kn.startType || guessStart(sn), line: kn.line || '', lineFrom: kn.line ? 'meet' : '',
        heats: heats ? String(heats) : '', athletes: ath ? String(ath) : '', round: roundOf(ev),

    // A single undated group takes the meet's header date
    if (order.length === 1 && order[0] === 'none' && meetDay.iso) { groups.none.iso = meetDay.iso; groups.none.wd = meetDay.wd; }
    var list = order.map(function (k) { return groups[k]; });
    list.sort(function (a, b) { return (a.iso || '9999') < (b.iso || '9999') ? -1 : (a.iso || '9999') > (b.iso || '9999') ? 1 : 0; });
    list.forEach(function (g) {
      g.events.sort(function (a, b) { return (a.start == null ? 1e9 : a.start) - (b.start == null ? 1e9 : b.start) || a.num - b.num; });
      var p = g.iso ? g.iso.split('-') : null;
      g.label = (g.wd >= 0 ? WD_LONG[g.wd] : list.length > 1 ? 'Undated events' : 'Meet day') + (p ? ' ' + +p[1] + '/' + +p[2] : g.md ? ' ' + g.md : '');
      g.dayName = g.wd >= 0 ? WD_LONG[g.wd] : (list.length > 1 ? 'Day ' : 'Meet day');
    });
    var n = 0; list.forEach(function (g) { if (/^Day $/.test(g.dayName)) g.dayName = 'Day ' + (++n); });
    return { meet: parsed.meet || {}, groups: list };
  }

  return { map: map, shortName: shortName, raceKey: raceKey, gender: gender, parseClock: parseClock, parseDay: parseDay };
})();
if (typeof module !== 'undefined') module.exports = ProgramMap;
</script>

<script>
/* Help tab — shared by Track Official, Clerking Calls and Track Umpire Calls.
   Content comes from <template id="helpSrc">, the offline PDF from <script type="text/plain" id="helpPdf"> (base64).
   HelpTab.render(main, startId) draws the tab; it keeps its search and scroll position across re-renders. */
var HelpTab = (function(){
  var q = '', toc = null;
  function $h(s, r){ return (r || document).querySelector(s); }
  function $$h(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function escH(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function src(){ var t = document.getElementById('helpSrc'); return t ? t.innerHTML : '<p>Help isn\'t available in this copy.</p>'; }
  function meta(){ var p = document.getElementById('helpPdf'); return { app:(p && p.getAttribute('data-app')) || 'Help', file:(p && p.getAttribute('data-file')) || 'Help.pdf' }; }

    var m = meta();
    main.innerHTML = '<div id="helpRoot" class="help">' +
      '<div class="card pad help-top"><div class="help-title"><h2>Help</h2><span class="muted">How to use every part of ' + escH(m.app) + '</span></div>' +
      '<div class="help-acts"><input class="f" id="helpQ" type="search" placeholder="Search help" autocomplete="off" aria-label="Search help" value="' + escH(q) + '">' +
      '<button class="btn primary" id="helpPdfBtn">Download PDF</button></div>' +
      '<p class="hint" id="helpMsg" style="margin:6px 0 0">The PDF has the same guide for reading offline or printing.</p></div>' +
      '<div class="help-body"><nav class="help-toc card pad" aria-label="Help contents"><b>Contents</b><ol id="helpToc"></ol></nav>' +
      '<select class="f help-jump" id="helpJump" aria-label="Jump to a section"></select>' +
      '<article class="help-doc card pad" id="helpDoc">' + src() + '</article></div></div>';
    var doc = $h('#helpDoc', main), secs = $$h('section', doc);
    toc = secs.map(function(s){ return { id:s.id, t:(s.querySelector('h2') || {}).textContent || s.id }; });
    $h('#helpToc', main).innerHTML = toc.map(function(x){ return '<li><a href="#' + x.id + '" data-hgo="' + x.id + '">' + escH(x.t) + '</a></li>'; }).join('');
    $h('#helpJump', main).innerHTML = '<option value="">Jump to a section…</option>' + toc.map(function(x){ return '<option value="' + x.id + '">' + escH(x.t) + '</option>'; }).join('');

      lead.innerHTML = 'For your role, start with <a href="#' + startId + '" data-hgo="' + startId + '">' + escH((toc.filter(function(x){ return x.id === startId; })[0] || {}).t) + '</a>.';
      doc.insertBefore(lead, doc.firstChild);
    }
    $h('#helpQ', main).addEventListener('input', function(e){ q = e.target.value; filter(); });
    $h('#helpJump', main).addEventListener('change', function(e){ if (e.target.value) go(e.target.value); e.target.value = ''; });
    $h('#helpPdfBtn', main).addEventListener('click', downloadPdf);
    $h('#helpRoot', main).addEventListener('click', function(e){
      var a = e.target.closest('a[href^="#"]'); if (!a) return;
      e.preventDefault(); go(a.getAttribute('data-hgo') || a.getAttribute('href').slice(1));
    });
    if (q) filter();
  }
  function go(id){
    var el = document.getElementById(id); if (!el) return;
    if (el.hidden){ q = ''; var i = $h('#helpQ'); if (i) i.value = ''; filter(); }
    el.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  function filter(){
    var doc = $h('#helpDoc'); if (!doc) return;
    var words = q.trim().toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
    $$h('section', doc).forEach(function(s){
      var hit = !words.length || words.every(function(w){ return s.textContent.toLowerCase().indexOf(w) >= 0; });
      s.hidden = !hit; if (hit) shown++;
      var li = $h('#helpToc a[data-hgo="' + s.id + '"]'); if (li) li.parentNode.hidden = !hit;
    });

    a.style.display = 'none'; document.body.appendChild(a); a.click(); setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(e){} }, 1500);
  }
  function downloadPdf(){
    var bytes = pdfBytes(), name = meta().file; if (!bytes){ note('The PDF isn\'t included in this copy.'); return; }

      });
      return;
    }
    localSave(bytes, name); note('Help PDF downloaded');

/* =====================================================================
   Lap counting — shared by Track Official and Track Umpire Calls.
   Races of 1500m and longer get lap counters. Setup (meet director, referee, chief umpire) names the
   counters, picks each race's counters and assigns each counter the athletes they count. A counter
   starts their own clock on the gun, taps an athlete's next box each time that athlete crosses the
   finish line, and stops when all of their athletes have finished.

   Data, under meets/<id>/:
     config/laps          { names:[...] }                     the counters (positions lp1, lp2 …)
     lapcfg/<raceKey>     { evId, secNum, title, enabled, crossings, slots:[{ id, pos, aths:[athKey] }] }
     laprun/<raceKey>__<slotId>  { start, stop, taps:{ athKey:[elapsed ms] }, dnf:{ athKey:true } }
   Each counter writes only their own laprun document, so taps never collide. Times are kept as elapsed
   milliseconds from that counter's own Start, so device clocks don't need to agree.

   The host app calls LapCount.init(adapter) once, LapCount.attach(db, meetId) when a shared meet opens,
   and LapCount.render(main, mode) for its Lap Counting tab (mode: 'manage', 'view' or 'count').
   ===================================================================== */
var LapCount = (function(){
  var A = null, db = null, meetId = null, subs = [];

  var pending = {}, retryTimer = null, clockTimer = null, wake = null;
  var MAX_PER = 5;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function nrm(x){ return String(x || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function P(x){ return 'meets/' + meetId + '/' + x; }
  function lsGet(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function lsSet(k, v){ try{ if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function toast(m){ if (A && A.toast) A.toast(m); }
  function soft(){ if (A && A.rerender) A.rerender(); }

  /* ---------- which races, and how many laps ---------- */
  var FIELD_RE = /\b(High|Long|Triple|Pole|Shot|Discus|Hammer|Javelin|Weight|Jump|Vault|Throw|Put|HJ|LJ|TJ|PV|SP|DT|HT|JT)\b/i;
  var RELAY_RE = /relay|\d\s*x\s*\d|\bDMR\b|\bSMR\b|medley/i;
  function distanceOf(name){
    var n = String(name || '');
    if (FIELD_RE.test(n) || RELAY_RE.test(n)) return 0;
    var m = n.match(/(\d{1,2},\d{3}|\d{3,5})\s*(?:m\b|meters?|metres?|M\b|-?meter)/i);
    if (m) return +m[1].replace(',', '');
    var mi = n.match(/(\d+(?:\.\d+)?)?\s*-?\s*miles?\b/i);
    if (mi) return Math.round((mi[1] ? +mi[1] : 1) * 1609.34);
    var k = n.match(/\b(\d{1,2})\s*k\b/i); if (k) return +k[1] * 1000;
    var bare = n.match(/\b(1500|1600|3000|3200|5000|10000)\b/); if (bare) return +bare[1];

  function autoCrossings(dist, lap){ return dist && lap ? Math.max(1, Math.ceil(dist / lap - 0.1)) : 0; }
  function crossingsFor(r){ var c = S.cfg[r.key]; return (c && +c.crossings > 0) ? +c.crossings : Math.max(1, autoCrossings(r.dist, A.lapLen())); }
  function boxLabel(i, n){ var left = n - i - 1; return left === 0 ? 'Finish' : left === 1 ? '1 · Bell' : String(left); }
  function athKey(l){ return l.bib ? 'b:' + String(l.bib).trim() : 'a:' + nrm(l.name) + '|' + nrm(l.team); }

  /* Races on the active day: one per heat. The adapter returns events with sections and lanes. */
  function races(){
    var out = [];
    (A.events() || []).forEach(function(e){
      var dist = distanceOf(e.name);
      (e.sections || []).forEach(function(s){
        var key = String(e.id).replace(/[\/~]/g, '_') + '_' + (s.num == null ? 1 : s.num), c = S.cfg[key];
        var on = c ? c.enabled !== false : dist >= 1500;
        if (dist < 1500 && !(c && c.enabled)) return;
        out.push({ key:key, evId:e.id, secNum:s.num, title:e.title, name:e.name, time:e.time || '', heat:(e.sections.length > 1 ? s.label : ''), dist:dist, auto:dist >= 1500, enabled:on,
          lanes:(s.lanes || []).filter(function(l){ return l && (l.name || l.bib); }).map(function(l){ return { key:athKey(l), lane:l.lane, name:l.name || '', team:l.team || '', bib:l.bib || '' }; }) });
      });
    });

  function raceByKey(k){ return races().filter(function(r){ return r.key === k; })[0] || null; }
  function slotsOf(key){ var c = S.cfg[key]; return (c && c.slots) || []; }
  function runId(key, slot){ return key + '__' + slot; }
  function runOf(key, slot){ return S.runs[runId(key, slot)] || null; }
  function rosterName(pos){ var m = String(pos || '').match(/^lp(\d+)$/); return m ? (S.roster[+m[1] - 1] || '').trim() : ''; }
  function posLabel(pos){ var m = String(pos || '').match(/^lp(\d+)$/); return m ? 'Counter ' + m[1] + (rosterName(pos) ? ' – ' + rosterName(pos) : '') : 'Unassigned'; }

  /* ---------- live data ---------- */
  function attach(_db, id){

    if (!db || !id) return;

    subs.push(db.doc(P('config/laps')).onSnapshot(function(s){ if (mine !== meetId) return; S.roster = (s.exists && s.data().names) || []; soft(); }, err));
    subs.push(db.collection(P('lapcfg')).onSnapshot(function(q){ if (mine !== meetId) return; S.cfg = {}; q.docs.forEach(function(d){ S.cfg[d.id] = d.data(); }); S.loaded = true; soft(); }, err));
    subs.push(db.collection(P('laprun')).onSnapshot(function(q){
      if (mine !== meetId) return;
      q.docs.forEach(function(d){
        var x = d.data(), cur = S.runs[d.id];
        if (pending[d.id]) return;                                  // this device has newer taps still saving
        if (cur && cur._local && (cur.updated || 0) > (x.updated || 0)) return;
        S.runs[d.id] = x;
      });
      if (!isCounting()) soft(); else refreshCount(true);
    }, err));
    restoreLocal();
  }
  function detach(){ subs.forEach(function(u){ try{ u(); }catch(e){} }); subs = []; S.roster = []; S.cfg = {}; S.runs = {}; S.loaded = false; }
  function restoreLocal(){
    /* A counter's taps are kept on the device too, so a dropped connection or reload never loses a lap. */
    try{
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i); if (k.indexOf('lp.run.' + meetId + '.') !== 0) continue;
        var id = k.slice(('lp.run.' + meetId + '.').length), v = lsGet(k);
        if (v && v._pending){ S.runs[id] = v; pending[id] = true; }
      }
      if (Object.keys(pending).length) flush();
    }catch(e){}
  }
  function saveRun(id, run){
    run.updated = Date.now(); run._local = true; S.runs[id] = run; pending[id] = true;
    lsSet('lp.run.' + meetId + '.' + id, Object.assign({}, run, { _pending:true }));
    flush();
  }
  function flush(){
    clearTimeout(retryTimer);
    Object.keys(pending).forEach(function(id){
      if (!db){ return; }
      var run = Object.assign({}, S.runs[id]); delete run._local; delete run._pending;
      db.doc(P('laprun/' + id)).set(run).then(function(){
        if ((S.runs[id] || {}).updated === run.updated){ delete pending[id]; lsSet('lp.run.' + meetId + '.' + id, Object.assign({}, run)); }
        syncPill();
      }, function(){ syncPill(); retryTimer = setTimeout(flush, 4000); });
    });
    syncPill();
  }
  function syncPill(){
    var el = document.getElementById('lpSync'); if (!el) return;
    var n = Object.keys(pending).length;
    el.textContent = n ? (navigator.onLine === false ? 'Offline – saved on this device' : 'Saving…') : 'Saved';
    el.className = 'lp-sync' + (n ? ' busy' : '');
  }
  function saveCfg(key, patch){
    var r = raceByKey(key), cur = S.cfg[key] || { evId:r ? r.evId : '', secNum:r ? r.secNum : null, title:r ? r.title + (r.heat ? ' · ' + r.heat : '') : '', enabled:r ? r.auto : true, crossings:null, slots:[] };
    var next = Object.assign({}, cur, patch, { updated:Date.now() });
    S.cfg[key] = next;
    return db.doc(P('lapcfg/' + key)).set(next).catch(function(){ toast('That change couldn\'t be saved. Check the connection.'); });
  }
  function saveRoster(names){ S.roster = names; return db.doc(P('config/laps')).set({ names:names, updated:Date.now() }).catch(function(){ toast('The counters couldn\'t be saved.'); }); }

  /* ---------- small confirm overlay (no browser dialogs) ---------- */
  function ask(title, body, okLabel, fn, danger){
    var ov = document.createElement('div'); ov.className = 'lp-ov';
    ov.innerHTML = '<div class="lp-modal" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3>' + (body ? '<p>' + body + '</p>' : '') +
      '<div class="lp-mbtns"><button class="btn" data-x="no">Cancel</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-x="ok">' + esc(okLabel) + '</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ var b = e.target.closest('[data-x]'); if (e.target === ov || b){ ov.remove(); if (b && b.dataset.x === 'ok') fn(); } });
    var ok = ov.querySelector('[data-x="ok"]'); if (ok) ok.focus();
  }

  /* =====================================================================
     Setup and results (meet director, referee, chief umpire; timing views only)
     ===================================================================== */
  function renderManage(main, readOnly){
    if (!db){ main.innerHTML = '<div class="card pad"><h2>Lap counting</h2><p>Share this meet live first. Lap counters work on their own phones, so the meet has to be shared for their counts to reach you.</p></div>'; return; }
    var list = races(), lap = A.lapLen(), fac = A.facility();
    var h = '<div class="lp-wrap">';
    h += '<div class="card pad lp-head"><div><h2 style="margin:0">Lap counting</h2><p class="hint" style="margin:4px 0 0">Races of 1500m and longer. ' + (readOnly ? 'Lap charts for every counted race.' : 'Name your lap counters, choose how many each race needs, and give each counter the athletes they count (usually 2–5).') + '</p></div>' +
      '<div class="lp-track"><span class="lp-k">Track</span>' + (readOnly || !A.canSetup() ? '<b>' + lap + 'm</b>' :
        '<select class="f" id="lpFac" aria-label="Track size">' + [['indoor', '200m (indoor)'], ['indoor300', '300m'], ['outdoor', '400m (outdoor)'], ['other', 'Other…']].map(function(o){ return '<option value="' + o[0] + '"' + (fac === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
        (fac === 'other' ? '<input class="f" id="lpLapLen" type="number" min="100" max="1000" step="1" value="' + lap + '" aria-label="Lap distance in meters" style="width:90px">' : '')) +
      '</div></div>';
    if (!readOnly && A.canSetup()){
      h += '<div class="card pad"><h3 style="margin-top:0">Lap counters <span class="count">' + S.roster.filter(function(n){ return (n || '').trim(); }).length + '</span></h3>' +
        '<p class="hint" style="margin-top:0">Each counter gets an access code on the Access tab. Add as many as your staffing allows.</p><div class="lp-roster">' +
        S.roster.map(function(n, i){ return '<div class="lp-rrow"><span class="lp-num">' + (i + 1) + '</span><input class="f" data-lpname="' + i + '" value="' + esc(n) + '" placeholder="Name" maxlength="40"><button class="btn sm" data-lp="rm-counter" data-i="' + i + '" aria-label="Remove counter ' + (i + 1) + '">Remove</button></div>'; }).join('') +
        '</div><button class="btn sm" data-lp="add-counter">+ Add a lap counter</button></div>';
    }
    if (!list.length) h += '<div class="card pad"><p class="muted" style="margin:0">No races of 1500m or longer on this day.</p></div>';
    list.forEach(function(r){ h += raceCard(r, readOnly || !A.canSetup()); });
    if (!readOnly && A.canSetup()){
      var others = (A.events() || []).filter(function(e){ return !eligible(e.name) && !FIELD_RE.test(e.name || ''); });
      if (others.length) h += '<div class="card pad"><label class="lbl" for="lpAdd">Count another race</label><div class="row" style="gap:8px;flex-wrap:wrap"><select class="f" id="lpAdd" style="flex:1 1 240px"><option value="">Choose a race…</option>' +
        others.map(function(e){ return '<option value="' + esc(e.id) + '">' + esc(e.title) + '</option>'; }).join('') + '</select><button class="btn sm" data-lp="add-race">Add</button></div><p class="hint">Shorter races usually don\'t use lap counters, but you can add one.</p></div>';
    }

    bindManage(main);
  }
  function raceCard(r, ro){
    var n = crossingsFor(r), slots = slotsOf(r.key), auto = autoCrossings(r.dist, A.lapLen()), c = S.cfg[r.key] || {};
    var assigned = {}; slots.forEach(function(s){ (s.aths || []).forEach(function(k){ assigned[k] = (assigned[k] || 0) + 1; }); });

        var l = r.lanes.filter(function(x){ return x.key === k; })[0] || { name:k.replace(/^[ab]:/, ''), bib:'', team:'' };
        var t = (run.taps && run.taps[k]) || [], laps = t.map(function(v, j){ return v - (j ? t[j - 1] : 0); });
        var mid = laps.slice(1, n - 1 > 1 ? n - 1 : laps.length).slice().sort(function(a, b){ return a - b; }), med = mid.length ? mid[Math.floor(mid.length / 2)] : 0;

        if (t.length > n) flags.push('More crossings than expected');
        if (med) laps.forEach(function(v, j){ if (j > 0 && j < n - 1 && (v < med * 0.6 || v > med * 1.7)) flags.push('Lap ' + (j + 1) + ' looks ' + (v < med ? 'too fast (missed lap?)' : 'slow (extra tap?)')); });

function dialog(html, okLabel, kind, onOk, onCancel){
  $('#dlg').innerHTML = '<div class="ov"><div class="modal" role="dialog" aria-modal="true">' + html +
    '<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-dlg="cancel">Cancel</button><button class="btn ' + (kind === 'go' ? 'go' : kind === 'pause' ? 'pause' : kind === 'warn' ? 'warn' : 'primary') + '" data-dlg="ok">' + esc(okLabel) + '</button></div></div></div>';
  var box = $('#dlg'); var f = $('input,select', box); if (f) f.focus();
  $('[data-dlg="cancel"]', box).onclick = function(){ box.innerHTML = ''; if (onCancel) onCancel(); };
  $('[data-dlg="ok"]', box).onclick = function(){ if (onOk() === false) return; box.innerHTML = ''; };
}

/* =====================================================================
   Live sync — when the app is opened from its published link (claude.ai),
   a shared meet's schedule, check-ins, start-line staging, call marks and
   start/pause/end state are kept in step across every device that has it
   open. Each device still keeps a full local copy, so a dropped connection
   only delays syncing; queued changes go out when it returns.
   ===================================================================== */
var Sync = (function(){
  var db = null, user = null, writable = true, lastErr = '', inited = false, suspended = false, loggedDeny = false;
  var subs = [], listUnsub = null, watching = null, remoteMeets = {}, remoteMarks = {};
  var flushTimer = null, flushing = false, retryTimer = null, rTimer = null, warnedQuota = false;
  var DEV = (function(){ try{ var v = localStorage.getItem('cc.dev'); if (!v){ v = uid('dev'); localStorage.setItem('cc.dev', v); } return v; }catch(e){ return uid('dev'); } })();

  function hash(str){ var x = 2166136261; for (var i = 0; i < str.length; i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return (x >>> 0).toString(36) + '.' + str.length; }
  function seg(v){ var o = String(v).replace(/[^A-Za-z0-9_-]/g, function(c){ return '~' + c.charCodeAt(0).toString(16) + '.'; }); return o.length > 160 ? 'h' + hash(o) : o; }
  function mid(kind, dayId, key){ return kind + '@' + seg(dayId) + '@' + seg(key); }
  function S(m){ m._sync = m._sync || {}; ['d','dt','m','t','p','k'].forEach(function(k){ m._sync[k] = m._sync[k] || {}; }); return m._sync; }
  function plain(o){ return JSON.parse(JSON.stringify(o)); }
  function base(id){ return 'meets/' + id; }

  function metaDef(m){ return { practice:!!m.practice, practiceKind:m.practiceKind || '', practiceV:+m.practiceV || 0, shoeKeep:+m.shoeKeep || 0, multi:m.multi || { n:0, coords:[] }, clerking:m.clerking !== false, owner:m.owner || null, ownerName:m.ownerName || '', archived:!!m.archived, archivedAt:m.archivedAt || '', name:m.name || '', templates:m.templates, officials:m.officials, notes:m.notes, dayOrder:m.days.map(function(d){ return d.id; }), mapOrder:m.maps.map(function(x){ return x.id; }) }; }
  function dayDef(d){ return { name:d.name, date:d.date || '', defaultTemplateId:d.defaultTemplateId || null, mapId:d.mapId || null, events:d.events }; }
  function mapDef(x){ return { name:x.name, markers:x.markers || {}, src:x.src }; }
  function defsOf(m){ var o = { meta:metaDef(m) }; m.days.forEach(function(d){ o['day:' + d.id] = dayDef(d); }); m.maps.forEach(function(x){ o['map:' + x.id] = mapDef(x); }); return o; }
  function localMarks(m){
    var o = {};
    m.days.forEach(function(d){
      [['call', d.status], ['ci', d.checkin], ['stg', d.staged]].forEach(function(p){ Object.keys(p[1] || {}).forEach(function(k){ o[mid(p[0], d.id, k)] = { day:d.id, kind:p[0], key:k, v:p[1][k] }; }); });
      if (d.run && (d.run.state !== 'idle' || (d.run.log || []).length)) o[mid('run', d.id, 'run')] = { day:d.id, kind:'run', key:'run', v:d.run };
    });
    return o;
  }

  /* Record what changed locally since the last sync, stamping each change with the time it was seen. */
  function collect(){
    if (!M || !M.shared) return;
    var who = Acct.me(); if (!M.owner && who.id && !who.anon){ M.owner = who.id; M.ownerName = who.name || who.email || ''; }
    var s = S(M), now = Date.now(), defs = defsOf(M), lm = localMarks(M);
    Object.keys(defs).forEach(function(k){ var hv = hash(JSON.stringify(defs[k])); if (s.d[k] !== hv){ s.d[k] = hv; s.dt[k] = now; s.p[k] = 1; } });
    Object.keys(s.d).forEach(function(k){ if (!defs[k] && s.d[k] !== 'gone'){ s.d[k] = 'gone'; s.dt[k] = now; s.p[k] = 1; } });
    Object.keys(lm).forEach(function(id){ var hv = hash(JSON.stringify(lm[id].v)); s.k[id] = [lm[id].day, lm[id].kind, lm[id].key]; if (s.m[id] !== hv){ s.m[id] = hv; s.t[id] = now; s.p['mk:' + id] = 1; } });
    Object.keys(s.m).forEach(function(id){ if (!lm[id] && s.m[id] !== 'null'){ s.m[id] = 'null'; s.t[id] = now; s.p['mk:' + id] = 1; } });
  }
  function changed(){ if (!M || !M.shared) return; collect(); schedule(400); }
  function schedule(ms){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }

  function shrinkMap(src){
    return new Promise(function(res){
      if (!src || src.length < 200000) return res(src);
      var img = new Image();
      img.onload = function(){
        var tries = [[1600, .7], [1300, .62], [1000, .55], [800, .5]], out = src;
        for (var i = 0; i < tries.length; i++){
          var sc = Math.min(1, tries[i][0] / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement('canvas');
          cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
          var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
          out = cv.toDataURL('image/jpeg', tries[i][1]); if (out.length < 200000) break;
        }
        res(out);
      };
      img.onerror = function(){ res(''); };
      img.src = src;
    });
  }
  function jobFor(m, k){
    var s = S(m), b = base(m.id);
    if (k === 'meta') return function(){ return db.doc(b).set(plain(Object.assign(metaDef(m), { updated:s.dt.meta, by:DEV, app:'track-officials' }))); };
    if (k.indexOf('day:') === 0){
      var did = k.slice(4), d = m.days.filter(function(x){ return x.id === did; })[0], ref = db.doc(b + '/days/' + seg(did));
      return function(){ return d ? ref.set(plain(Object.assign(dayDef(d), { id:did, updated:s.dt[k], by:DEV }))) : ref.delete(); };
    }
    if (k.indexOf('map:') === 0){
      var xid = k.slice(4), x = m.maps.filter(function(y){ return y.id === xid; })[0], mref = db.doc(b + '/maps/' + seg(xid));
      return function(){ if (!x) return mref.delete(); return shrinkMap(x.src).then(function(src){ return mref.set(plain({ id:xid, name:x.name, markers:x.markers || {}, src:src, updated:s.dt[k], by:DEV })); }); };
    }
    if (k.indexOf('mk:') === 0){
      var id = k.slice(3), meta = s.k[id]; if (!meta) return null;
      var lm = localMarks(m)[id];
      return function(){ return db.doc(b + '/marks/' + id).set(plain({ day:meta[0], kind:meta[1], key:meta[2], v:lm ? lm.v : null, t:s.t[id], dev:DEV })); };
    }
    return null;
  }
  /* Send queued changes, four at a time, oldest definitions first so days exist before their marks. */
  function flush(){

    var m = M, s = S(m), keys = Object.keys(s.p).sort(function(a, b){ var r = function(k){ return k === 'meta' ? 0 : k.indexOf('mk:') === 0 ? 2 : 1; }; return r(a) - r(b); });
    if (!keys.length) return;
    flushing = true;
    var i = 0, failed = false;

      var k = keys[i++], job = jobFor(m, k);
      if (!job){ delete s.p[k]; return next(); }
      return job().then(function(){ delete s.p[k]; lastErr = ''; }).catch(function(e){
        var c = e && e.code;
        if (c === 'invalid_argument' && /day:|map:/.test(k)) { lastErr = 'toolarge'; toast('"' + (k.indexOf('day:') === 0 ? (day(k.slice(4)) || {}).name : 'A map') + '" is too large to share. Try fewer events per day.'); delete s.p[k]; return; }

        if (c === 'quota_exceeded'){ failed = true; lastErr = 'quota'; if (!warnedQuota){ warnedQuota = true; toast('The shared storage for this app is full. Stop sharing older meets to free space.'); } return; }

    }

      flushing = false;
      if (m === M) Store.set('meet:' + m.id, m);
      if (Object.keys(s.p).length){ clearTimeout(retryTimer); retryTimer = setTimeout(flush, failed ? 12000 : 300); }
      pill();
    });

  /* ---------- applying what other devices wrote ---------- */
  function ensureDay(m, id, at){
    var d = m.days.filter(function(x){ return x.id === id; })[0];
    if (!d){ d = { id:id, name:'Day', date:'', defaultTemplateId:(m.templates[0] || {}).id, mapId:null, events:[], status:{}, checkin:{}, staged:{}, run:{ state:'idle', log:[] } }; if (at == null) m.days.push(d); else m.days.splice(at, 0, d); }

  }
  function applyMeta(m, data){

    if (data.practice === true){ m.practice = true; m.practiceKind = data.practiceKind || ''; if (+data.practiceV) m.practiceV = +data.practiceV; }
    if (data.multi) m.multi = data.multi;
    if (data.shoeKeep != null) m.shoeKeep = +data.shoeKeep || 0;
    if (data.owner) { m.owner = data.owner; m.ownerName = data.ownerName || ''; } m.archived = data.archived === true; m.archivedAt = data.archivedAt || '';

      m.days.forEach(function(d){ if (keep.indexOf(d) < 0 && !s.dt['day:' + d.id]) keep.push(d); }); // a day made here but not sent yet stays
      m.days = keep;
      Object.keys(s.d).forEach(function(k){ if (k.indexOf('day:') === 0 && data.dayOrder.indexOf(k.slice(4)) < 0 && !m.days.some(function(d){ return 'day:' + d.id === k; })) { delete s.d[k]; delete s.p[k]; } });
    }
    if (data.mapOrder){
      var mk = [];
      data.mapOrder.forEach(function(id){ var x = m.maps.filter(function(y){ return y.id === id; })[0]; if (!x){ x = { id:id, name:'Map', src:'', markers:{} }; } mk.push(x); });
      m.maps.forEach(function(x){ if (mk.indexOf(x) < 0 && !s.dt['map:' + x.id]) mk.push(x); });
      m.maps = mk;
    }
    normalize(m);
    s.d.meta = hash(JSON.stringify(metaDef(m))); s.dt.meta = data.updated; delete s.p.meta;
    return true;
  }
  function applyDay(m, data){
    var s = S(m), k = 'day:' + data.id;
    if (!data.id || !(data.updated > (s.dt[k] || 0))) return false;
    var d = ensureDay(m, data.id);
    d.name = data.name; d.date = data.date || ''; d.defaultTemplateId = data.defaultTemplateId; d.mapId = data.mapId || null; d.events = data.events || [];
    normalize(m);
    s.d[k] = hash(JSON.stringify(dayDef(d))); s.dt[k] = data.updated; delete s.p[k];
    return true;
  }
  function applyMap(m, data){
    var s = S(m), k = 'map:' + data.id;
    if (!data.id || !(data.updated > (s.dt[k] || 0))) return false;
    var x = m.maps.filter(function(y){ return y.id === data.id; })[0];
    if (!x){ x = { id:data.id }; m.maps.push(x); }
    x.name = data.name; x.markers = data.markers || {}; if (data.src) x.src = data.src;
    s.d[k] = hash(JSON.stringify(mapDef(x))); s.dt[k] = data.updated; delete s.p[k];
    return true;
  }
  function applyMark(m, id, data){
    var s = S(m);
    if (!data || !(data.t > (s.t[id] || 0))) return false;
    var d = m.days.filter(function(x){ return x.id === data.day; })[0];
    if (!d) return false;            // the day hasn't arrived yet; tried again when it does
    var v = data.v, k = data.key;

      if (data.kind === 'call' && v){ queue = queue.filter(function(q){ return q.key !== k; }); showPopup(); }
      if (data.kind === 'run' && (!v || v.state !== 'running')){ queue = []; showPopup(); }
    }
    return true;
  }
  function applyAllMarks(m){ var n = 0; Object.keys(remoteMarks).forEach(function(id){ if (applyMark(m, id, remoteMarks[id])) n++; }); return n; }

  function typing(){ var a = document.activeElement; return !!(a && a.closest && a.closest('#main') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox'); }

      if (!M) return;
      Store.set('meet:' + M.id, M); libEntry(M); Store.set('library', LIB);
      if (typing()){ UI.pendingRender = true; return; }
      if ($('#dlg .modal')){ UI.pendingRender = true; return; }
      var y = window.scrollY; render(); window.scrollTo(0, y);
    }, 150);
  }

  /* ---------- subscriptions ---------- */

    if (watching === M.id) return;

    var id = M.id, b = base(id), err = function(e){ if (e && e.code === 'revoked') writable = false; lastErr = 'offline'; pill(); };

      if (!M || M.id !== id) return;

      var n = 0; qs.docChanges().forEach(function(ch){ if (ch.type !== 'removed' && applyMap(M, ch.doc.data())) n++; });

    }, err));
    subs.push(db.collection(b + '/marks').onSnapshot(function(qs){

      var n = 0; qs.docChanges().forEach(function(ch){ if (ch.type === 'removed') return; remoteMarks[ch.doc.id] = ch.doc.data(); if (applyMark(M, ch.doc.id, remoteMarks[ch.doc.id])) n++; });

      pill();
    }, err));

  }
  function stoppedElsewhere(){
    var e = LIB.meets.filter(function(x){ return x.id === M.id; })[0];
    M.shared = false; delete M._sync; if (e) e.shared = false;
    unwatch(); saveNow(); render();
    toast('Sharing was turned off for "' + M.name + '". It stays on this device.');
  }

  /* ---------- share / join / stop ---------- */
  function shareDialog(id){

      '<p class="hint">People need <b>Contributor</b> access (or higher) to the app to make changes; Viewers see updates but can\'t tap. Sound, voice and the test clock stay set per device.</p>', 'Share live', 'go', function(){
        M.shared = true; M._sync = { d:{}, dt:{}, m:{}, t:{}, p:{}, k:{} };
        var e = libEntry(M); e.shared = true;

  var REMOTE_COLS = ['marks', 'days', 'maps', 'calls', 'clears', 'finals', 'config', 'shoes', 'lapcfg', 'laprun'];

  function meetsPanel(){

  }

  /* ---------- status pill ---------- */
  function pill(){
    var p = $('#syncPill'); if (!p) return;
    var st = 'local', txt = '';
    if (!M) { p.classList.add('hidden'); return; }
    if (!db){ if (!M.shared){ p.classList.add('hidden'); return; } txt = 'NOT SYNCING'; }
    else if (!M.shared){ txt = 'THIS DEVICE ONLY'; }
    else {
      var n = Object.keys(S(M).p).length;

      else if (M.archived){ st = 'wait'; txt = 'ARCHIVED · VIEW ONLY'; }
      else if (!writable){ st = 'wait'; txt = 'VIEW ONLY'; }

function ipCommit(confirmed){

  if (!confirmed && ipReplaceWarning(groups)) return;
  var stats = { added:0, updated:0, days:0 }, firstDay = null;
  function newDay(g, maps, tplDefault){
    var d = { id:uid('d'), name:g.dayName, date:g.iso || '', defaultTemplateId:g.tpl || tplDefault, mapId:maps[0] ? maps[0].id : null, events:[], status:{}, run:{ state:'idle', log:[] } };
    g.events.forEach(function(e){ d.events.push(ipNewEvent(e, d.defaultTemplateId)); stats.added++; });
    stats.days++; firstDay = firstDay || d.id;
    return d;
  }

    var m = defaults(); m.name = ($('#ipName').value || '').trim() || IMP.mapped.meet.name || 'New meet';
    if (M && $('#ipReuse') && $('#ipReuse').checked){ var c = JSON.parse(JSON.stringify(M)); m.templates = c.templates; m.maps = c.maps; m.officials = c.officials; m.notes = c.notes; ['sound','voice','popups','catchup','theme'].forEach(function(k){ m.settings[k] = c.settings[k]; }); }

    var d = day(g.target); firstDay = firstDay || d.id;

      if (e.athletes) h.athletes = e.athletes;

      if (!h.line && e.line) h.line = e.line;
      h.num = e.num; h.fullName = e.fullName; h.entries = mergeEntries(h.entries, e.entries); if (e.note) h.note = e.note;
      stats.updated++;
    });
    d.events.sort(function(a, b){ return (a.start == null ? 1e9 : a.start) - (b.start == null ? 1e9 : b.start); });
  });

}

/* =====================================================================
   Shoe check — look up any athlete entered in the meet: name, school, events.
   How a check is recorded on the athlete is still to be decided.
   ===================================================================== */
function shoeNorm(x){ return String(x || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function shoeIndex(){
  var map = {}, list = [];
  M.days.forEach(function(d){ d.events.forEach(function(e){ (e.entries || []).forEach(function(s){ s.lanes.forEach(function(l){
    var relay = !!(l.members && l.members.length) || /relay|\dx\d|dmr|smr/i.test(e.name);
    var legs = isRelayLane(l), seen = {};
    var people = legs ? (laneLegs(l) || []).concat(l.members || []).map(cleanMember).filter(function(n){ if (!n || seen[shoeNorm(n)]) return false; seen[shoeNorm(n)] = 1; return true; }).map(function(n){ return { name:n, team:relaySchool(l), bib:'' }; })
      : [{ name:l.name || l.team, team:l.team, bib:l.bib }];
    people.forEach(function(p){
      if (!p.name) return;
      var key = shoeNorm(p.name) + '|' + shoeNorm(p.team);
      var a = map[key]; if (!a){ a = map[key] = { name:p.name, team:p.team || '', bibs:{}, events:[], legOnly:true }; list.push(a); }
      if (!legs) a.legOnly = false;
      if (p.bib) a.bibs[p.bib] = 1;
      a.events.push({ d:d, e:e, s:s, l:l, relay:relay });
    });
  }); }); }); });
  /* A relay leg whose school didn't line up joins the one individual entry with the same name. */
  list = list.filter(function(a){
    if (!a.legOnly) return true;
    var same = list.filter(function(x){ return !x.legOnly && shoeNorm(x.name) === shoeNorm(a.name); });
    if (same.length !== 1) return true;
    same[0].events = same[0].events.concat(a.events); return false;
  });
  list.forEach(function(a){ a.bib = Object.keys(a.bibs).join(', '); a.events.sort(function(x, y){ return M.days.indexOf(x.d) - M.days.indexOf(y.d) || (x.e.start == null ? 1e9 : x.e.start) - (y.e.start == null ? 1e9 : y.e.start); }); });
  return list;
}

/* =====================================================================
   Entries — events with nobody entered yet (manually added events, semis and
   finals before qualifiers are known), athletes added by the clerks from the
   meet program, and relay legs in running order.
   ===================================================================== */
var EMPTY_SECS = typeof WeakMap === 'function' ? new WeakMap() : null;
/* The heats to walk through. An event with no entries still gets one empty heat so it shows everywhere. */
function evSecs(e){
  if (e.entries && e.entries.length) return e.entries;
  var x = EMPTY_SECS && EMPTY_SECS.get(e);
  if (!x){ x = { kind:'Heat', num:1, of:1, lanes:[], empty:true }; if (EMPTY_SECS) EMPTY_SECS.set(e, x); }
  return [x];
}
function isRelayEv(e){
  if (/relay|\b\d\s*x\s*\d|\bdmr\b|\bsmr\b|shuttle/i.test((e.fullName || '') + ' ' + (e.name || ''))) return true;
  return (e.entries || []).some(function(s){ return s.lanes.some(function(l){ return (l.members && l.members.length) || l.legs; }); });
}
/* Meet programs list relay runners with their class year ("Ann Able SR") and some put the relay letter in the team column. */
function cleanMember(n){ return String(n || '').replace(/\s+(FR|SO|JR|SR|GR|R-?(FR|SO|JR|SR)|\d{1,2})\.?$/i, '').trim(); }
function relaySchool(l){ return /^'?[A-H]'?$/.test(String(l.team || '').trim()) ? String(l.name || '').replace(/\s+'?[A-H]'?$/, '').trim() : (l.team || String(l.name || '').replace(/\s+'?[A-H]'?$/, '').trim()); }
function relayLetter(l){ var m = String(l.team || '').match(/^'?([A-H])'?$/) || String(l.name || '').match(/\s'?([A-H])'?$/); return m ? m[1] : ''; }
function relayName(l){ var L = relayLetter(l); return relaySchool(l) + (L ? ' ' + L : ''); }
function isRelayLane(l){ return !!((l.legs && l.legs.some(Boolean)) || (l.members && l.members.length)); }
function laneLegs(l){ return l.legs && l.legs.some(Boolean) ? l.legs : null; }
/* Legs in running order when the clerks have set them; otherwise the names from the meet program. */
function legsText(l){
  var g = laneLegs(l);
  if (g) return g.map(function(n, i){ return n ? (i + 1) + '. ' + n : ''; }).filter(Boolean).join(' · ');
  return l.members && l.members.length ? l.members.join(' · ') : '';
}
function canEditEntries(){ return (clerkOn() ? ['director', 'headClerk', 'clerk', 'multi'] : ['director', 'multi']).indexOf(UI.role) >= 0 && Sync.canWrite(); }
function entCount(e){ return (e.entries || []).reduce(function(n, s){ return n + s.lanes.length; }, 0); }
function entButton(e, big){
  if (!canEditEntries()) return '';
  var relay = isRelayEv(e), empty = !entCount(e);
  return '<button class="btn ' + (big ? 'primary' : 'sm') + '" data-entedit="' + e.id + '">' + (empty ? (relay ? 'Enter teams and legs' : 'Enter athletes') : relay ? 'Edit teams and legs' : 'Edit athletes') + '</button>';
}

/* ---------- people already in the meet program ---------- */
function entPeople(){
  var idx = shoeIndex(), byKey = {}, teams = {};
  idx.forEach(function(a){ a.ekey = a.name + (a.team ? ' — ' + a.team : ''); byKey[a.ekey.toLowerCase()] = a; if (a.team) teams[a.team] = 1; });
  return { list:idx, byKey:byKey, teams:Object.keys(teams).sort(function(a, b){ return a.localeCompare(b); }) };
}
function entFind(P, v){
  v = String(v || '').trim(); if (!v) return null;
  var hit = P.byKey[v.toLowerCase()]; if (hit) return hit;
  var nm = shoeNorm(v.split(' — ')[0]), same = P.list.filter(function(a){ return shoeNorm(a.name) === nm; });
  return same.length === 1 ? same[0] : null;
}

var ENT = null;

  if (!f || !canEditEntries()) return;

function entWho(l){ return l.name ? l.name + (l.team ? ' — ' + l.team : '') : ''; }

    return '<section class="ent-heat" data-h="' + h + '"><div class="row ent-hh"><b>' + esc((s.kind || 'Heat') + ' ' + (h + 1)) + '</b><span class="muted" style="font-size:13px">' + s.lanes.filter(function(l){ return l.name || l.team; }).length + (R ? ' teams' : ' athletes') + '</span><span class="grow"></span>' + (ENT.secs.length > 1 ? '<button class="btn sm warn" data-ent="delheat">Remove ' + unitOf(ENT.e, s) + '</button>' : '') + '</div>' +
      s.lanes.map(function(l, r){
